/* MOA v1.1 — playful, compact planner */
:root{--peach:#f8e6d6;--mint:#e7f2e8;--pink:#f8e9ee}
.brandmark{border-radius:16px 16px 14px 16px;box-shadow:2px 3px 0 #bdd5be;transform:rotate(-9deg)}
.primary,.secondary,.daytab,.filter{border-radius:17px;transition:transform .16s,box-shadow .16s}
.primary:hover,.secondary:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(68,104,79,.09)}
.heroart{border-radius:42px}.feature{border-radius:27px}.trip{border-radius:29px;transition:transform .2s}.trip:hover{transform:translateY(-4px)}
.panel{border-radius:27px}.detailhero{border-radius:30px;position:relative;overflow:hidden}.detailhero:after{content:'✦';position:absolute;right:95px;top:13px;color:#b3cbad;font-size:27px}
.softtag{display:inline-flex;background:#fff6eb;color:#98744f;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}
.modebar{display:flex;gap:7px;background:#f1f5ef;padding:6px;border-radius:19px;margin:16px 0 20px}
.modebar button{flex:1;border:0;background:transparent;padding:12px 8px;border-radius:14px;color:#688071;font-weight:800}
.modebar button.active{background:white;color:var(--greenDark);box-shadow:0 3px 12px #344b3610}
.plannerTabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:thin}.plannerTabs button{white-space:nowrap;flex-shrink:0;border:1px solid #dae7da;background:white;color:#6b8274;padding:10px 14px;border-radius:15px;font-size:13px;font-weight:700}.plannerTabs button.active{background:#4f7b64;color:white;border-color:#4f7b64}
.plannerGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.75fr);gap:18px;margin:20px 0 72px}.plannerMain,.plannerSide{min-width:0}.plannerSide .panel{margin-bottom:14px}
.entry{border:1px solid #e7ece5;border-radius:17px;padding:15px;margin:10px 0;background:#fff;display:flex;gap:11px;align-items:flex-start;min-width:0}.entry .em{background:#eff5ec;border-radius:13px;padding:5px 6px;font-size:15px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:39px}.entrybody{flex:1;min-width:0;overflow-wrap:anywhere}.entrybody strong{font-size:14px}.entrybody p{font-size:12px;color:#77877c;line-height:1.75;margin:6px 0 0}.entryactions{display:flex;gap:2px;flex-shrink:0}.entryactions button{border:0;background:#f4f7f2;color:#688272;border-radius:10px;padding:8px;font-size:13px}
.statusChip{font-size:11px;border-radius:30px;background:#fff1df;color:#97743e;padding:4px 8px;margin-left:5px;font-weight:700}.doneText{text-decoration:line-through;color:#a1aaa0}.tinyHint{font-size:12px;color:#8c9a8d;line-height:1.8}.emptyMini{padding:38px 15px;text-align:center;background:#fafcf9;border:1px dashed #d5e5d5;border-radius:18px;font-size:13px;color:#849789}.actionrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.miniStat{display:flex;align-items:center;gap:8px;padding:12px;background:#f4f8f2;border-radius:15px;color:#50745a;font-size:13px;font-weight:700}
.list-check{width:20px;height:20px;accent-color:#537d64;flex-shrink:0;cursor:pointer}.listrow{display:flex;align-items:center;gap:11px;border-bottom:1px solid #edf1eb;padding:13px 3px;min-width:0}.listrow label{flex:1;font-size:13px;overflow-wrap:anywhere}.amount{font-weight:800;color:#486e57;font-variant-numeric:tabular-nums}.moneybar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.moneybar>div{background:#f3f7f1;border-radius:16px;padding:14px}.moneybar b{display:block;margin-top:6px;font-size:17px}.moneybar small{color:#879888;font-size:11px}.responsiveTable{overflow-x:auto}.responsiveTable table{border-collapse:collapse;width:100%;min-width:470px;font-size:12px}.responsiveTable th,.responsiveTable td{padding:12px 9px;text-align:left;border-bottom:1px solid #e6ebe5;vertical-align:middle}.responsiveTable th{background:#f5f8f2;color:#6d806f}.responsiveTable button{border:0;background:#eef4ec;color:#54725e;border-radius:8px;padding:6px 9px}.mobileModeNote{background:#fff7eb;border-radius:15px;padding:13px;color:#947b60;font-size:12px;margin-bottom:14px}
@media(max-width:800px){.plannerGrid{grid-template-columns:1fr}.plannerSide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.plannerSide .panel{margin:0}.detailhero{padding:23px}.modebar{margin-top:12px}}
@media(max-width:540px){.plannerSide{grid-template-columns:1fr}.plannerTabs button{padding:11px}.moneybar{gap:6px}.moneybar>div{padding:10px}.moneybar b{font-size:13px}.entry{padding:12px}.detailhero h1{font-size:23px}}

/* MOA V1.2 — buddy mascot and dependable expense entry */
.moa-buddy{position:absolute;z-index:5;left:48%;bottom:48px;transform:translateX(-50%) rotate(-5deg);width:142px;height:183px;filter:drop-shadow(0 16px 12px rgba(42,83,50,.15));animation:buddyBob 4s ease-in-out infinite}
.buddy-handle{position:absolute;width:62px;height:29px;border:11px solid #54816e;border-bottom:0;border-radius:23px 23px 0 0;top:1px;left:40px}
.buddy-body{position:absolute;left:8px;top:21px;width:126px;height:133px;background:#f7d6a2;border:5px solid #5e826a;border-radius:29px 31px 27px 30px;box-shadow:inset -11px -9px 0 #edc28e,4px 6px 0 #7baf8e;display:flex;justify-content:center;align-items:center}
.buddy-eyes{display:flex;gap:30px;position:absolute;top:50px}.buddy-eyes i{width:9px;height:12px;background:#344c40;border-radius:50%;display:block}.buddy-cheeks{position:absolute;color:#ed9e9f;font-size:14px;top:65px;left:25px;letter-spacing:9px;white-space:pre}.buddy-smile{border:3px solid #446b54;border-top:0;border-radius:0 0 15px 15px;width:20px;height:11px;position:absolute;top:79px;left:50px}.buddy-sticker{position:absolute;left:17px;top:12px;font-size:20px;color:#fff9ee;transform:rotate(-12deg)}
.buddy-foot{position:absolute;background:#5c826b;border-radius:0 0 10px 10px;width:21px;height:20px;bottom:13px}.buddy-foot.one{left:31px}.buddy-foot.two{right:30px}
.buddy-speech{position:absolute;right:-79px;top:-13px;background:#fffefa;border:2px solid #c6dec6;border-radius:21px 21px 21px 5px;color:#5a7865;font-size:12px;font-weight:800;padding:10px 14px;white-space:nowrap;transform:rotate(7deg)}
@keyframes buddyBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-5deg)}50%{transform:translateX(-50%) translateY(-8px) rotate(-2deg)}}
.quickExpense{background:linear-gradient(140deg,#f1f7ed,#fff9ef);border:1px solid #dfe9d9;border-radius:22px;padding:19px;margin:18px 0 22px}.quickExpenseTitle{font-weight:800;font-size:16px;margin-bottom:14px}.quickExpenseTitle span{display:block;font-weight:500;color:#819080;font-size:12px;margin-top:5px}.quickExpenseFields{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;align-items:end;gap:10px}.quickExpenseFields label{font-size:12px;color:#597363;font-weight:800;min-width:0}.quickExpenseFields input:not([type=checkbox]){display:block;min-width:0;width:100%;margin-top:7px;border:1px solid #d9e3d9;border-radius:12px;padding:12px 10px;background:#fff;color:#293c34;font-size:13px}.quickExpenseFields .quickCheck{display:flex;gap:5px;align-items:center;white-space:nowrap;padding-bottom:13px}.quickCheck input{accent-color:#5e876a;width:17px;height:17px}.expenseSubmit{margin-top:14px;width:100%}.formError{color:#a14536;font-size:12px;margin:12px 0 0}
@media(max-width:840px){.quickExpenseFields{grid-template-columns:1fr 1fr}.quickExpenseFields .quickCheck{padding:9px 0}}
@media(max-width:540px){.quickExpenseFields{grid-template-columns:1fr}.quickExpense{padding:15px}.moa-buddy{left:46%;bottom:38px;transform:translateX(-50%) scale(.8);animation:none}.buddy-speech{right:-50px;font-size:10px}}
@media(prefers-reduced-motion:reduce){.moa-buddy{animation:none}}

/* V1.3: compact itinerary, route preview, and mobile travel controls */
.routePreview{background:linear-gradient(135deg,#f0f6ea,#fff9ee);border:1px solid #e1e9dc;border-radius:19px;padding:16px;margin:14px 0 18px}
.routeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.routeTop strong{font-size:14px}.routeTop small{color:#718375;font-size:11px}
.routeStops{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}
.routeStop{display:inline-flex;gap:7px;align-items:center;max-width:100%;background:#fff;border:1px solid #dfe9d9;padding:7px 10px;border-radius:30px;font-size:12px;font-weight:700;color:#4b6855}
.routeStop .routeNumber{background:#6e9b7b;color:white;width:19px;height:19px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px}
.routeDivider{color:#9ab49c;font-size:13px}.routeNote{color:#879383;font-size:11px;line-height:1.6;margin:6px 0}
.entry{transition:background .15s;border-radius:13px}.entry:hover{background:#fbfdf9}.entry .em{flex:none}.entrybody{min-width:0;flex:1}.entrybody p{line-height:1.6;overflow-wrap:anywhere}.entryactions{flex-shrink:0}
.dayStatus{margin-left:9px;font-size:10px;opacity:.85}.daytab{white-space:nowrap}.dayline{overflow-x:auto;flex-wrap:nowrap;padding-bottom:7px;scrollbar-width:thin}

  if(!personalReady){toast('계정 여행을 준비하는 중이에요. 연결 상태를 확인해 주세요.');return false}
  try{const serialized=JSON.stringify(trips);if(new Blob([serialized]).size>900000){toast('여행 데이터가 저장 용량에 가까워요. 커버사진을 줄이거나 JSON 백업 후 정리해 주세요.');return false}localStorage.setItem(personalKey(cloudUser.uid),serialized);if(cloudActive&&!cloudApplying)queueCloudSave();else if(!cloudActive&&!cloudApplying)toast('⚠️ 서버 연결이 중단돼 현재 기기에만 저장됐어요. 연결 상태를 확인해 주세요.');return true}
  catch(e){toast('저장에 실패했어요. 저장 공간을 확인해 주세요.');return false}
}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>r.innerHTML='',3000)}
function parseDate(d){let a=String(d||'').split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)}
function days(t){const n=Math.round((parseDate(t.end)-parseDate(t.start))/86400000)+1;return Number.isFinite(n)&&n>0?Math.min(n,120):1}
function fmt(d){return String(d||'').replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1.$2.$3')}
function duration(t){return `${fmt(t.start)} – ${fmt(t.end)} · ${days(t)-1}박 ${days(t)}일`}
function selected(t){if(collabId&&t==='collab:'+collabId)return sharedTrip;return trips.find(x=>x.id===t)}
function theme(t){return ({sea:['#b9d9d4','#e5eee7','🏝️'],mountain:['#b8d0b1','#eff0d9','⛰️'],city:['#dfd6c8','#f3e5d0','🏙️'],nature:['#c8d7ba','#eee4bb','🌿'],spring:['#ead3db','#f4e7db','🌸']})[t.theme]||['#c4dbca','#f4e5cd','✈️']}
function cover(t){const c=theme(t);return safeCoverPhoto(t.coverPhoto)?'<div class="cover v210-cover-photo" style="background-image:url('+t.coverPhoto+')"></div>':`<div class="cover" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span class="symbol">${c[2]}</span></div>`}
function card(t){const linkedId=t.collabId||collabList.find(c=>c.sourceTripId===t.id)?.id;return `<article class="trip">${cover(t)}<div class="tripbody"><span class="badge ${t.status==='done'?'done':''}">${linkedId?'👥 함께하는 여행':t.status==='done'?'✓ 다녀온 여행':'✦ 계획 중'}</span><h3>${esc(t.title)}</h3><p>📍 ${esc(t.destination)}<br>📅 ${duration(t)}</p><div class="tripfoot"><span class="tiny muted">👥 ${Number(t.people)||1}명 · ${esc(t.type)}</span><button class="textbtn" ${linkedId?`data-open-collab="${esc(linkedId)}"`:`data-detail="${esc(t.id)}"`}>여행 열기 ↗</button></div><div class="v211-card-actions">${linkedId?`<button type="button" class="v211-delete" data-hide-owned-collab="${esc(linkedId)}" data-source-trip="${esc(t.id)}" aria-label="${esc(t.title)} 내 여행에서 삭제">내 여행에서 삭제</button>`:`<button type="button" class="v211-delete" data-delete-trip="${esc(t.id)}" aria-label="${esc(t.title)} 삭제">여행 삭제</button>`}</div></div></article>`}

 for(const c of collabList)if(active.some(t=>c.sourceTripId===t.id))linked.add(c.id);

async function deleteDashboardTrip(id){
 if(!userVerified()||!personalReady||!cloudActive){toast('계정 여행이 서버에 연결된 뒤 삭제할 수 있어요.');return}
 const t=trips.find(x=>x.id===id);if(!t)return;
 const connected=t.collabId||collabList.find(c=>c.sourceTripId===t.id)?.id;
 if(connected){toast('공동 여행은 다른 참여자를 위해 이곳에서 전체 삭제할 수 없어요.');return}
 if(!confirm('「'+t.title+'」 여행을 삭제할까요?\n일정·경비·사진이 함께 삭제되며 복구할 수 없어요.'))return;
 try{
   if(cloudPending||cloudBusy){toast('기존 변경 사항을 저장한 뒤 삭제해 주세요.');return}
   const {db}=setupCloud(),uid=cloudUser.uid,ref=db.collection('users').doc(uid).collection('data').doc('travel');
   await db.runTransaction(async transaction=>{
     const doc=await transaction.get(ref);
     const remote=safePersonalList(doc.exists?doc.data()?.trips:[]);
     if(!remote.some(x=>x.id===id))return;
     const remaining=remote.filter(x=>x.id!==id);
     transaction.set(ref,{trips:remaining,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:uid});
   });
   if(cloudUser?.uid!==uid)return;
   trips=trips.filter(x=>x.id!==id);
   localStorage.setItem(personalKey(uid),JSON.stringify(trips));
   if(page==='dashboard')dashboard();
   toast('여행을 삭제했어요.');
 }catch(err){toast('삭제 실패: '+(err.code||err.message)+'. 여행은 그대로 유지돼요.')}
}

async function removeSharedFromMyList(id,sourceId){
 if(!userVerified()||!cloudUser){toast('로그인이 필요해요.');return}
 if(!/^[A-Za-z0-9_-]{8,128}$/.test(id||'')){toast('잘못된 여행 연결이에요.');return}
 const uid=cloudUser.uid;
 const source=sourceId?trips.find(t=>t.id===sourceId):null;
 const index=collabList.find(c=>c.id===id);
 if(source&&source.collabId!==id&&index?.sourceTripId!==source.id){
   toast('연결된 여행을 확인할 수 없어요.');return;
 }
 const title=source?.title||index?.title||'공동 여행';
 const message=source?
   '「'+title+'」을 내 여행에서 삭제할까요?\n내가 만든 개인 원본과 내 목록 연결이 제거돼요. 공동 여행의 공유 데이터와 다른 참여자 일정은 그대로 유지돼요.':
   '「'+title+'」을 내 여행 목록에서 제거할까요?\n다른 참여자의 여행과 공동 편집 데이터는 유지돼요.';
 if(!confirm(message))return;
 if(source&&(!personalReady||!cloudActive||cloudPending||cloudBusy)){
   toast('내 계정 저장이 완료된 뒤 다시 삭제해 주세요.');return;
 }
 try{
   const {db}=setupCloud(),indexRef=db.collection('users').doc(uid).collection('collaborations').doc(id);
   if(source){
     const personalRef=db.collection('users').doc(uid).collection('data').doc('travel');
     // Only remove this user's original personal trip and their list index.
     await db.runTransaction(async transaction=>{
       const doc=await transaction.get(personalRef);
       const remote=safePersonalList(doc.exists?doc.data()?.trips:[]);
       const existing=remote.find(t=>t.id===source.id);
       if(existing&&existing.collabId&&existing.collabId!==id)throw Error('여행 연결이 달라서 삭제를 중단했어요.');
       transaction.set(personalRef,{trips:remote.filter(t=>t.id!==source.id),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:uid});
       transaction.delete(indexRef);
     });
   }else await indexRef.delete();
   if(cloudUser?.uid!==uid)return;
   if(source){
     trips=trips.filter(t=>t.id!==source.id);
     try{localStorage.setItem(personalKey(uid),JSON.stringify(trips))}catch(e){console.warn('기기 백업 갱신 실패',e)}
   }
   collabList=collabList.filter(c=>c.id!==id);
   if(collabId===id){leaveCollab();detailId=null}

function itineraryEntries(t){

  const stays=(t.stays||[]).filter(x=>x.checkIn<=date&&x.checkOut>=date)
    .sort((a,b)=>(a.checkIn||'').localeCompare(b.checkIn||''))
    .map(x=>({kind:'stay',id:x.id,name:'🏨 '+x.name,address:x.address||'',lat:x.lat,lon:x.lon,
       note:date===x.checkIn?'체크인 '+(x.checkInTime||'시간 미정'):date===x.checkOut?'체크아웃 '+(x.checkOutTime||'시간 미정'):'숙박 중',
       source:x,candidate:false}));
  const rides=(t.transportBookings||[]).filter(x=>x.date===date)
    .sort((a,b)=>(a.depart||'99:99').localeCompare(b.depart||'99:99'))
    .map(x=>({kind:'transport',id:x.id,name:(x.type||'🚆 교통')+' · '+(x.from||'출발지')+' → '+(x.to||'도착지'),
       address:x.from||'',lat:x.lat,lon:x.lon,note:[x.depart&&'출발 '+x.depart,x.arrive&&'도착 '+x.arrive,x.code].filter(Boolean).join(' · '),

  const available=new Map(defaults.map(x=>[x.kind+':'+x.id,x])),ordered=[];
  for(const key of saved){if(available.has(key)){ordered.push(available.get(key));available.delete(key)}}
  return [...ordered,...available.values()];
}

function reorderStops(sourceId,targetId){const t=selected(detailId);if(!t||sourceId===targetId)return;let list=dayStops(t),from=list.findIndex(x=>x.id===sourceId),to=list.findIndex(x=>x.id===targetId);if(from<0||to<0)return;let [item]=list.splice(from,1);list.splice(to,0,item);list.forEach((x,i)=>x.order=i);if(save()){detail();toast('방문 순서를 변경했어요 🌿')}}
function stepStop(id,step){const t=selected(detailId);if(!t)return;let list=dayStops(t),i=list.findIndex(x=>x.id===id),j=i+step;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];list.forEach((x,k)=>x.order=k);if(save())detail()}
function openDayRoute(){const t=selected(detailId);if(!t)return;const items=itineraryEntries(t).filter(s=>!s.candidate&&String(s.address||s.name||'').trim());if(items.length<2){toast('주소가 있는 확정 장소를 2곳 이상 추가해 주세요.');return}const points=items.slice(0,10).map(s=>String(s.address||s.name).trim());const base='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(points[0])+'&destination='+encodeURIComponent(points[points.length-1])+'&travelmode=driving';const mids=points.slice(1,-1);const url=base+(mids.length?'&waypoints='+encodeURIComponent(mids.join('|')):'');window.open(url,'_blank','noopener,noreferrer');if(items.length>10)toast('지도 링크에는 처음 10개 장소만 포함했어요.');}
function stopRows(t){let list=dayStops(t);return list.length?list.map((s,i)=>`<div class="entry" data-stop-id="${esc(s.id)}" draggable="${plannerMode==='plan'}"><span class="em">${plannerMode==='plan'?`<span class="draghandle" title="잡아서 순서 변경">⠿</span>`:''}${s.candidate?`<span class="routeNumber" style="font-size:20px;font-weight:900">${i+1}</span>`:`<span class="routeNumber" style="background:#e5f0e5;color:#355e44;padding:5px 10px;border-radius:50%;font-size:20px;font-weight:900">${i+1}</span>`}</span><div class="entrybody"><strong class="${s.done?'doneText':''}">${esc(s.name)}</strong>${s.candidate?'<span class="statusChip">후보</span>':''}<p>${formatStop(s)}</p>${s.address?`<div class="actionrow" style="margin-top:7px"><button class="textbtn" data-map="${esc(s.id)}">📍 지도 열기</button><button class="textbtn" data-copy-address="${esc(s.id)}">주소 복사</button></div>`:''}</div><div class="entryactions">${plannerMode==='travel'?`<button data-done-stop="${esc(s.id)}" title="방문 체크">${s.done?'↩️':'✓'}</button>`:`<span class="orderbuttons"><button class="secondary mini" title="위로" data-step-stop="${esc(s.id)}:-1">↑</button><button class="secondary mini" title="아래로" data-step-stop="${esc(s.id)}:1">↓</button></span><button data-edit-stop="${esc(s.id)}" title="수정">✎</button><button data-delete-stop="${esc(s.id)}" title="삭제">×</button>`}</div></div>`).join(''):`<div class="emptyMini">🐣 아직 일정이 비어 있어요.<br>첫 장소를 콕! 추가해볼까요?</div>`}
function isoForDay(t,index){let d=parseDate(t.start);d.setDate(d.getDate()+index);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayBookings(t){let day=isoForDay(t,detailDay);let stays=(t.stays||[]).filter(x=>x.checkIn<=day&&x.checkOut>=day).map(x=>`<div class="bookingMini">🏨 <b>${esc(x.name)}</b> · ${day===x.checkIn?'체크인 '+(x.checkInTime||''):day===x.checkOut?'체크아웃 '+(x.checkOutTime||''):'숙박 중'}${x.address?' · '+esc(x.address):''}</div>`);let rides=(t.transportBookings||[]).filter(x=>x.date===day).map(x=>`<div class="bookingMini">🚆 <b>${esc(x.type)}</b> ${esc(x.from||'')} → ${esc(x.to||'')} · ${esc(x.depart||'시간 미정')}${x.code?' · '+esc(x.code):''}</div>`);return stays.length||rides.length?`<div class="dayBookings"><strong>🏡 오늘의 예약</strong>${[...stays,...rides].join('')}</div>`:''}
function staysView(t){let rows=(t.stays||[]).slice().sort((a,b)=>a.checkIn.localeCompare(b.checkIn));return `<div class="secthead"><h2>🏨 숙소 관리</h2><button class="secondary mini" data-add-stay>＋ 숙소 추가</button></div><p class="tinyHint">체크인과 체크아웃 날짜를 등록하면 날짜별 일정에 자동 표시돼요. 체크아웃 날짜는 퇴실 일정으로 표시돼요.</p>${rows.length?rows.map(x=>`<div class="item bookingCard"><strong>🏨 ${esc(x.name)}</strong><p>📅 ${esc(x.checkIn)} → ${esc(x.checkOut)}<br>🕒 체크인 ${esc(x.checkInTime||'미정')} · 체크아웃 ${esc(x.checkOutTime||'미정')}<br>📍 ${esc(x.address||'주소 미등록')}</p>${x.note?`<p>${esc(x.note)}</p>`:''}<div class="actionrow"><button class="secondary mini" data-edit-stay="${esc(x.id)}">수정</button><button class="secondary mini" data-delete-stay="${esc(x.id)}">삭제</button></div></div>`).join(''):'<div class="emptyMini">🛎️ 묵을 숙소를 추가해 보세요!</div>'}`}
function transportView(t){let rows=(t.transportBookings||[]).slice().sort((a,b)=>(a.date+a.depart).localeCompare(b.date+b.depart));return `<div class="secthead"><h2>✈️ 교통편 관리</h2><button class="secondary mini" data-add-transport>＋ 교통 추가</button></div><p class="tinyHint">항공권·기차·버스·페리·렌터카 등 장거리 이동 기록이에요. 일반 장소 간 이동수단은 일정에서 관리해요.</p>${rows.length?rows.map(x=>`<div class="item bookingCard"><strong>${esc(x.type)} · ${esc(x.from||'출발지')} → ${esc(x.to||'도착지')}</strong><p>📅 ${esc(x.date)} · ${esc(x.depart||'출발시간 미정')}${x.arrive?' → '+esc(x.arrive):''}<br>${x.code?'🎫 '+esc(x.code)+' · ':''}${esc(x.note||'')}</p><div class="actionrow"><button class="secondary mini" data-edit-transport="${esc(x.id)}">수정</button><button class="secondary mini" data-delete-transport="${esc(x.id)}">삭제</button></div></div>`).join(''):'<div class="emptyMini">🛫 항공권이나 기차표를 추가해 보세요!</div>'}`}

function transportForm(id){const t=selected(detailId);ensureTrip(t);let x=t.transportBookings.find(x=>x.id===id);modal(`<form id="transportForm"><div class="modalhead"><h2>✈️ ${x?'교통편 수정':'교통편 추가'}</h2><button class="iconbtn" type="button" data-close>×</button></div><div class="field"><label>교통 종류</label><select name="type">${['✈️ 항공','🚄 기차','🚌 버스','⛴️ 페리','🚙 렌터카','🚕 기타'].map(v=>`<option ${x?.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>이동 날짜 *</label><input type="date" name="date" required min="${esc(t.start)}" max="${esc(t.end)}" value="${esc(x?.date||t.start)}"></div><div class="formrow"><div class="field"><label>출발지</label><input name="from" maxlength="100" value="${esc(x?.from||'')}"></div><div class="field"><label>도착지</label><input name="to" maxlength="100" value="${esc(x?.to||'')}"></div></div><div class="formrow"><div class="field"><label>출발 시간</label><input type="time" name="depart" value="${esc(x?.depart||'')}"></div><div class="field"><label>도착 시간</label><input type="time" name="arrive" value="${esc(x?.arrive||'')}"></div></div><div class="field"><label>편명·열차번호 (선택)</label><input name="code" maxlength="80" value="${esc(x?.code||'')}"></div><div class="field"><label>메모</label><textarea name="note" maxlength="500">${esc(x?.note||'')}</textarea></div><div class="modalactions"><button type="button" class="secondary" data-close>취소</button><button class="primary">저장하기</button></div></form>`);document.getElementById('transportForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),vals={type:f.get('type'),date:f.get('date'),from:String(f.get('from')).trim(),to:String(f.get('to')).trim(),depart:f.get('depart'),arrive:f.get('arrive'),code:String(f.get('code')).trim(),note:String(f.get('note')).trim()};if(x)Object.assign(x,vals);else t.transportBookings.push({id:uuid(),...vals});if(save()){closeModal();detail();toast('교통편을 저장했어요! 🚆')}}}
function dayProgress(t){let list=dayStops(t).filter(x=>!x.candidate),done=list.filter(x=>x.done).length;return `<div class="dayProgress">방문 ${done}/${list.length}곳<div class="progressTrack"><div class="progressFill" style="width:${list.length?Math.round(done/list.length*100):0}%"></div></div></div>`}

const MOA_CURRENCIES={KRW:'원',CNY:'위안',JPY:'엔',USD:'달러',EUR:'유로',TWD:'대만 달러',THB:'바트',VND:'동',HKD:'홍콩 달러',SGD:'싱가포르 달러',GBP:'파운드',AUD:'호주 달러',CAD:'캐나다 달러'};
function guessLocalCurrency(destination){
  const d=String(destination||'').toLowerCase();
  if(/중국|상하이|상해|베이징|북경|칭다오|청도|광저우|광주|선전|심천|china|shanghai|beijing/.test(d))return 'CNY';
  if(/일본|도쿄|오사카|후쿠오카|삿포로|오키나와|japan|tokyo|osaka/.test(d))return 'JPY';
  if(/대만|타이베이|타이중|taiwan|taipei/.test(d))return 'TWD';
  if(/태국|방콕|치앙마이|푸켓|thailand|bangkok/.test(d))return 'THB';
  if(/베트남|하노이|다낭|호치민|vietnam|hanoi/.test(d))return 'VND';
  if(/홍콩|hong kong/.test(d))return 'HKD';
  if(/싱가포르|singapore/.test(d))return 'SGD';
  if(/영국|런던|uk|london/.test(d))return 'GBP';
  if(/호주|시드니|멜버른|australia|sydney/.test(d))return 'AUD';
  if(/캐나다|밴쿠버|토론토|canada|vancouver/.test(d))return 'CAD';
  if(/프랑스|독일|이탈리아|스페인|네덜란드|파리|로마|프랑크푸르트|유럽|europe|paris|rome/.test(d))return 'EUR';
  if(/미국|하와이|괌|사이판|뉴욕|로스앤젤레스|la|usa|united states|hawaii/.test(d))return 'USD';
  return 'USD';
}
function localCurrency(t){return Object.hasOwn(MOA_CURRENCIES,t?.localCurrency)?t.localCurrency:guessLocalCurrency(t?.destination)}
function expenseCurrency(x){return Object.hasOwn(MOA_CURRENCIES,x?.currency)?x.currency:'KRW'}
function expenseText(x){return money(x.amount)+(expenseCurrency(x)==='KRW'?'원':' '+expenseCurrency(x))}
function currencyChoices(t,chosen){
  const c=localCurrency(t),options=[...new Set(['KRW',c,chosen].filter(v=>v&&Object.hasOwn(MOA_CURRENCIES,v)))];
  return options.map(v=>'<option value="'+v+'" '+(chosen===v?'selected':'')+'>'+v+' · '+MOA_CURRENCIES[v]+'</option>').join('');
}
function payerList(x){
  const map=new Map();
  for(const m of expenseMembers){if(m.uid&&m.role!=='removed')map.set(m.uid,String(m.name||'여행자'))}
  if(x?.payerUid&&!map.has(x.payerUid))map.set(x.payerUid,String(x.payer||'이전 여행자'));
  return [...map].map(([uid,name])=>({uid,name}));
}
function payerChoiceHTML(x){
  if(!collabId)return '<input name="payer" maxlength="40" value="'+esc(x?.payer||'')+'" placeholder="결제자 이름 (선택)">';
  const members=payerList(x);
  return '<select name="payerUid"><option value="">결제자 선택</option>'+members.map(m=>'<option value="'+esc(m.uid)+'" '+(x?.payerUid===m.uid?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select>'+
    (!members.length?'<small class="tinyHint">여행자 목록을 불러오는 중이에요.</small>':'')+
    (x?.payer&&!x?.payerUid?'<small class="tinyHint">기존 결제자: '+esc(x.payer)+' · 새 결제자를 선택하면 변경돼요.</small>':'');
}
function payerFields(form,old){
  if(!collabId)return {payer:String(form.get('payer')||'').trim(),payerUid:null};
  const uid=String(form.get('payerUid')||'');
  const found=payerList(old).find(m=>m.uid===uid);
  if(uid&&!found)throw Error('여행자 목록을 새로 불러온 뒤 선택해 주세요.');
  if(!uid&&old?.payer&&!old?.payerUid)return {payer:old.payer,payerUid:null};
  return {payer:found?.name||'',payerUid:uid||null};
}
function payerName(x){
  const m=x?.payerUid?expenseMembers.find(v=>v.uid===x.payerUid):null;
  return m?.name||x?.payer||'미정';
}
function currencyTotals(arr,currency){
  const rows=arr.filter(x=>expenseCurrency(x)===currency);
  const sum=rows.reduce((n,x)=>n+(Number(x.amount)||0),0);
  const paid=rows.filter(x=>x.paid).reduce((n,x)=>n+(Number(x.amount)||0),0);
  return {sum,paid,pending:sum-paid};
}
function expenseAmountValid(amount,currency){
  return Number.isFinite(amount)&&amount>=0&&amount<=1e10&&(['KRW','JPY','VND'].includes(currency)?Number.isSafeInteger(amount):Math.abs(Math.round(amount*100)-amount*100)<1e-6);
}

function expenseView(t){
  const arr=t.expenses;
  const currencies=[...new Set(['KRW',localCurrency(t),...arr.map(expenseCurrency)])];
  const sums=currencies.map(c=>({currency:c,...currencyTotals(arr,c)})).filter(v=>v.sum||v.currency==='KRW'||v.currency===localCurrency(t));
  const mainCurrency=localCurrency(t);
  return '<div class="secthead"><div><span class="softtag">🪙 여행 경비</span><h2>💰 경비 기록</h2></div><button type="button" class="secondary mini" data-add-item="expense">＋ 상세 입력</button></div>'+
  '<p class="tinyHint">실제 결제한 통화와 금액을 그대로 기록해요. 환율 계산·원화 환산·여행자 정산은 아직 제공하지 않아요.</p>'+
  '<div class="v21-currencybar"><label for="tripCurrency">여행지 기본 통화</label><select id="tripCurrency" aria-label="여행지 기본 통화" '+(collabId&&collabRole==='viewer'?'disabled':'')+'>'+Object.entries(MOA_CURRENCIES).map(([c,name])=>'<option value="'+c+'" '+(mainCurrency===c?'selected':'')+'>'+c+' · '+name+'</option>').join('')+'</select></div>'+
  '<div class="v21-moneygroups">'+sums.map(x=>'<div class="v21-moneygroup"><strong>'+x.currency+' · '+MOA_CURRENCIES[x.currency]+'</strong><div><span>총 '+money(x.sum)+'</span><small>결제 완료 '+money(x.paid)+' · 예정 '+money(x.pending)+'</small></div></div>').join('')+'</div>'+
  '<form id="quickExpenseForm" class="quickExpense" novalidate><div class="quickExpenseTitle">✿ 경비 바로 추가하기</div><div class="quickExpenseFields v21-expense-fields">'+
    '<label>항목명<input name="name" type="text" maxlength="80" placeholder="예: 저녁 식사" required></label>'+
    '<label>결제 통화<select name="currency">'+currencyChoices(t,mainCurrency)+'</select></label>'+
    '<label>금액<input name="amount" inputmode="decimal" type="number" min="0" max="10000000000" step="any" placeholder="예: 150" required></label>'+
    '<label>결제자'+payerChoiceHTML(null)+'</label>'+
    '<label class="quickCheck"><input type="checkbox" name="paid"> 결제 완료</label></div>'+
    '<button type="submit" class="primary expenseSubmit">＋ 경비 저장하기</button><p id="expenseError" class="formError" role="alert" hidden></p></form>'+
  (arr.length?'<div class="responsiveTable v2-records"><table><thead><tr><th>항목</th><th>결제자</th><th>결제 금액</th><th>상태</th><th>관리</th></tr></thead><tbody>'+
   arr.map(x=>'<tr><td data-label="항목">'+esc(x.name)+'</td><td data-label="결제자">'+esc(payerName(x))+'</td><td data-label="금액" class="amount">'+esc(expenseText(x))+'</td><td data-label="상태"><button type="button" data-toggle-item="expense:'+esc(x.id)+'">'+(x.paid?'✅ 완료':'○ 예정')+'</button></td><td data-label="관리"><button data-edit-item="expense:'+esc(x.id)+'">수정</button> <button data-delete-item="expense:'+esc(x.id)+'">삭제</button></td></tr>').join('')+
   '</tbody></table></div>':'<div class="emptyMini">🪙 첫 번째 경비를 추가해 보세요!</div>');

async function compressCoverPhoto(file){
 if(!file||!file.type.startsWith('image/'))throw Error('사진 파일을 선택해 주세요.');
 if(file.size>20*1024*1024)throw Error('20MB 이하 사진을 선택해 주세요.');

 for(const target of [900,780,660,540,420]){
   const scale=Math.min(1,target/Math.max(w,h));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   for(const quality of [.75,.62,.5,.4]){
     const out=canvas.toDataURL('image/jpeg',quality);
     if(out.length<=45000)return out;
   }
 }
 throw Error('사진을 더 작게 줄일 수 없어요. 다른 사진을 선택해 주세요.');
}

function resolvedCandidateParent(t,raw){

 if(t.importedFrom!=='munggu-nyangi-shanghai-v14-backup')return raw;

}

async function searchPlaces(){
  const input=document.getElementById('geoSearch'),box=document.getElementById('geoSearchResults');
  if(!input||!box)return;
  const term=input.value.trim();
  if(term.length<2){box.hidden=false;box.textContent='장소 이름을 두 글자 이상 입력해 주세요.';return}
  if(searchPlaces.running){box.hidden=false;box.textContent='장소를 검색하고 있어요. 결과가 나올 때까지 기다려 주세요.';return}
  if(Date.now()-(searchPlaces.lastRequest||0)<1300){box.hidden=false;box.textContent='검색은 잠시 간격을 두고 다시 눌러 주세요.';return}
  searchPlaces.lastRequest=Date.now();searchPlaces.running=true;
  const button=document.getElementById('geoSearchButton');if(button)button.disabled=true;
  box.hidden=false;box.textContent='🔎 장소를 찾고 있어요…';
  const destination=String(selected(detailId)?.destination||'').trim();
  const appendDestination=destination&&!term.toLowerCase().includes(destination.toLowerCase())?term+', '+destination:term;
  const key=localStorage.getItem(MAP_KEY)||'',current=term;
  try{
    let items=[];
    if(key){
      const url='https://api.geoapify.com/v1/geocode/search?text='+encodeURIComponent(appendDestination)+'&format=json&limit=6&lang=ko&apiKey='+encodeURIComponent(key);
      const response=await fetch(url);if(!response.ok)throw Error('장소 검색 응답 '+response.status);
      const data=await response.json();
      items=(data.results||[]).map(x=>({lat:Number(x.lat),lon:Number(x.lon),formatted:x.formatted||'',name:x.name||''}));
    }else{
      // Nominatim is only requested on an explicit search action, not on each keystroke.
      const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&accept-language=ko&q='+encodeURIComponent(appendDestination);
      const response=await fetch(url,{headers:{Accept:'application/json'}});
      if(!response.ok)throw Error('장소 검색 응답 '+response.status);
      const data=await response.json();
      items=data.map(x=>({lat:Number(x.lat),lon:Number(x.lon),formatted:x.display_name||'',name:x.name||''}));
    }
    if(!document.getElementById('geoSearch')||input.value.trim()!==current)return;
    placeSearchResults=items.filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon));
    box.innerHTML=placeSearchResults.length?'<div class="v24-search-hint">검색 결과 중 실제 장소를 선택해 주세요.</div>'+
      placeSearchResults.map((x,i)=>'<button type="button" data-choose-place="'+i+'"><b>📍 '+esc(x.name||x.formatted.split(',')[0]||'장소')+'</b><small>'+esc(x.formatted||'주소 미표시')+'</small></button>').join(''):
      '<div class="v24-search-empty">검색 결과가 없어요. 도시명과 장소명을 함께 입력해 다시 검색해 주세요.</div>';
    box.querySelectorAll('[data-choose-place]').forEach(btn=>btn.addEventListener('click',()=>{
      const p=placeSearchResults[Number(btn.dataset.choosePlace)];if(!p)return;
      placeSelected={lat:p.lat,lon:p.lon,formatted:p.formatted||'',name:p.name||''};
      const form=document.getElementById('stopForm');if(!form)return;
      form.elements.address.value=p.formatted||'';
      if(!form.elements.place.value.trim())form.elements.place.value=p.name||p.formatted.split(',')[0]||'';
      const chosen=document.getElementById('chosenGeo');if(chosen)chosen.textContent='✅ 지도 위치 연결 완료 · '+(p.formatted||p.name);
      box.hidden=true;toast('📍 지도 위치를 연결했어요. 저장하면 여행 지도에 표시돼요.');
    }));
  }catch(e){if(document.getElementById('geoSearchResults'))box.textContent='장소 검색에 실패했어요. 잠시 후 다시 시도해 주세요. ('+e.message+')'}
  finally{searchPlaces.running=false;if(button)button.disabled=false}
}

 const ref=cloudRef,uid=cloudUser?.uid;

   const payload=JSON.stringify(trips);
   if(new Blob([payload]).size>900000)throw Error('여행 데이터 용량이 너무 커요. 커버사진을 정리하거나 JSON 백업을 받아주세요.');

async function bootstrapPersonalCloud(user){

 try{
   const {db}=setupCloud(),ref=db.collection('users').doc(user.uid).collection('data').doc('travel');
   const snap=await ref.get({source:'server'});
   if(token!==personalBootToken||cloudUser?.uid!==user.uid)return;

     const previous=localStorage.getItem(archiveKey);
     if(!previous){
       try{localStorage.setItem(archiveKey,JSON.stringify(scoped))}catch(e){console.warn('과거 기기 백업 보관 실패',e)}

   }
   if(token!==personalBootToken||cloudUser?.uid!==user.uid)return;
   trips=next;
   localStorage.setItem(key,JSON.stringify(next));
   personalReady=true;personalBooting=false;
   beginCloud();

 }catch(err){
   if(token!==personalBootToken)return;
   personalBooting=false;personalReady=false;

function sharedClone(o){return o==null?o:JSON.parse(JSON.stringify(o))}
function sharedEqual(a,b){return JSON.stringify(a)===JSON.stringify(b)}
const SHARED_ARRAYS=['stops','expenses','shopping','checklist','stays','transportBookings'];
function sharedDiff(base,working){
  const delta={fields:{},collections:{}};
  const keys=new Set([...Object.keys(base||{}),...Object.keys(working||{})]);
  for(const k of keys){
    if(SHARED_ARRAYS.includes(k)||['id','collabId','shareId','createdAt'].includes(k))continue;
    if(k==='dayOrders'){
      const changes={};for(const d of new Set([...Object.keys(base?.dayOrders||{}),...Object.keys(working?.dayOrders||{})])){
        if(!sharedEqual(base?.dayOrders?.[d],working?.dayOrders?.[d]))changes[d]=working?.dayOrders?.[d]===undefined?null:sharedClone(working.dayOrders[d]);
      }
      if(Object.keys(changes).length)delta.fields.dayOrders=changes;
    }else if(!sharedEqual(base?.[k],working?.[k]))delta.fields[k]=working?.[k]===undefined?null:sharedClone(working[k]);
  }
  for(const col of SHARED_ARRAYS){
    const old=new Map((base?.[col]||[]).filter(x=>x?.id).map(x=>[x.id,x]));
    const current=new Map((working?.[col]||[]).filter(x=>x?.id).map(x=>[x.id,x]));
    const edits={};
    for(const [id,item] of current){
      if(!old.has(id)){edits[id]={new:sharedClone(item)};continue}
      const previous=old.get(id),fields={};
      for(const k of new Set([...Object.keys(previous),...Object.keys(item)])){
        if(!sharedEqual(previous[k],item[k]))fields[k]=item[k]===undefined?null:sharedClone(item[k]);
      }
      if(Object.keys(fields).length)edits[id]={fields};
    }
    for(const id of old.keys())if(!current.has(id))edits[id]={remove:true};
    if(Object.keys(edits).length)delta.collections[col]=edits;
  }
  return delta;
}
function applySharedDiff(remote,delta){
  const merged=sharedClone(remote||{});
  for(const [k,v] of Object.entries(delta.fields)){
    if(k==='dayOrders'){
      merged.dayOrders=merged.dayOrders||{};
      for(const [day,order] of Object.entries(v)){if(order===null)delete merged.dayOrders[day];else merged.dayOrders[day]=order}
    }else if(v===null)delete merged[k];else merged[k]=sharedClone(v);
  }
  for(const [col,edits] of Object.entries(delta.collections)){
    const items=(merged[col]||[]).map(x=>sharedClone(x));
    for(const [id,change] of Object.entries(edits)){
      const i=items.findIndex(x=>x.id===id);
      if(change.remove){if(i>=0)items.splice(i,1)}
      else if(change.new){if(i<0)items.push(sharedClone(change.new));else items[i]={...items[i],...sharedClone(change.new)}}
      else if(i>=0){for(const [k,v] of Object.entries(change.fields)){if(v===null)delete items[i][k];else items[i][k]=sharedClone(v)}}
    }
    merged[col]=items;
  }
  return merged;
}

async function flushSharedSave(){

  const ref=sharedStateRef,id=collabId,base=sharedClone(sharedBase),next=sharedClone(sharedTrip),version=sharedEditVersion;
  const delta=sharedDiff(base,next);
  if(!Object.keys(delta.fields).length&&!Object.keys(delta.collections).length){sharedDirty=false;return}
  sharedBusy=true;
  try{
    let merged=null;
    await setupCloud().db.runTransaction(async transaction=>{
      const snap=await transaction.get(ref);
      if(!snap.exists||!snap.data()?.trip)throw Error('공동 여행 저장 문서가 없어요.');
      merged=applySharedDiff(snap.data().trip,delta);
      transaction.update(ref,{trip:merged,updatedBy:cloudUser.uid,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    if(collabId!==id)return;
    sharedBase=sharedClone(merged);sharedDeferredRemote=null;
    if(sharedEditVersion===version){sharedTrip=sharedClone(merged);sharedDirty=false;sharedSaveFailed=false}

  finally{sharedBusy=false;if(collabId===id){if(sharedDirty&&!sharedSaveFailed)scheduleSharedSave();else if(sharedRefreshNeeded&&!sharedDirty){sharedRefreshNeeded=false;refreshSharedFromServer(id)}}}
}

async function refreshSharedFromServer(id){
  if(collabId!==id||sharedDirty||sharedBusy||!sharedStateRef)return;
  try{
    const snap=await sharedStateRef.get({source:'server'});
    if(collabId!==id||sharedDirty||sharedBusy||!snap.exists||!snap.data()?.trip)return;
    const incoming=snap.data().trip;
    if(!sharedEqual(sharedBase,incoming)){
      if(modalRoot.querySelector('#overlay')){sharedDeferredRemote=sharedClone(incoming);return}
      sharedBase=sharedClone(incoming);sharedTrip=sharedClone(incoming);render();
    }
  }catch(e){if(collabId===id)toast('공동 여행 최신 정보 확인 실패: '+(e.code||e.message))}
}

    collabMetaUnsub=ref.onSnapshot(doc=>{
      if(collabId!==id)return;
      if(!doc.exists){toast('공동 여행을 찾을 수 없어요.');leaveCollab();nav('dashboard');return}
      collabMeta=doc.data();
    },e=>{toast('공동 여행 연결 오류: '+(e.code||e.message));leaveCollab();nav('dashboard')});
    sharedStateUnsub=stateRef.onSnapshot(snap=>{
      if(collabId!==id||!snap.exists||!snap.data()?.trip||snap.metadata.hasPendingWrites)return;
      if(sharedDirty||sharedBusy){sharedRefreshNeeded=true;return}
      const incoming=snap.data().trip;

        if(modalRoot.querySelector('#overlay')){sharedDeferredRemote=sharedClone(incoming);return}
        sharedBase=sharedClone(incoming);sharedTrip=sharedClone(incoming);render();
      }
    },e=>toast('공동 여행 동기화 실패: '+(e.code||e.message)));

function importData(){
 if(!cloudUser||!userVerified()){accountModal();return}
 const picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';
 picker.addEventListener('change',async()=>{
  const file=picker.files?.[0];if(!file)return;
  try{
   const raw=JSON.parse(await file.text()),imported=Array.isArray(raw)?raw:raw.trips;
   if(!Array.isArray(imported)||!imported.length||!imported.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.start==='string'&&typeof t.end==='string'&&Array.isArray(t.stops)))throw Error('올바른 모아 여행 파일이 아니에요.');

   if(!confirm(msg))return;

   const added=imported.map(t=>{const copy=JSON.parse(JSON.stringify(t));copy.id=uuid();delete copy.shareId;delete copy.guestPreviewId;delete copy.collabId;ensureTrip(copy);return copy});
   trips=[...added,...trips];
   if(!save()){trips=previous;return}
   detailId=null;page='dashboard';render();
   toast(added.length+'개 여행을 새로 추가했어요! 🌷');
   if(!cloudActive)toast('새 여행이 이 브라우저에 추가됐어요. 다른 기기와 동기화하려면 데이터 관리에서 클라우드 업로드가 필요해요.');
  }catch(err){toast('가져오기 실패: '+(err.message||'올바른 JSON 파일이 아니에요.'))}
 });
 picker.click();
}

document.addEventListener('submit',e=>{if(e.target?.id!=='quickExpenseForm')return;e.preventDefault();if(collabId&&collabRole==='viewer'){toast('보기 전용 여행이에요.');return}const form=e.target,t=selected(detailId);if(!t){toast('여행을 선택한 뒤 다시 시도해 주세요.');return}ensureTrip(t);const f=new FormData(form),name=String(f.get('name')||'').trim(),raw=String(f.get('amount')||'').trim(),amount=Number(raw),error=form.querySelector('#expenseError');const fail=message=>{error.textContent=message;error.hidden=false;toast(message)};if(!name)return fail('경비 항목을 입력해 주세요.');const currency=String(f.get('currency')||'KRW');if(raw===''||!Object.hasOwn(MOA_CURRENCIES,currency)||!expenseAmountValid(amount,currency))return fail('결제 통화와 금액을 확인해 주세요.');let payer;try{payer=payerFields(f,null)}catch(err){return fail(err.message)}const expense={id:uuid(),name,amount,currency,...payer,paid:f.has('paid'),done:false};t.expenses.push(expense);if(!save()){t.expenses.pop();return fail('저장에 실패했어요. 브라우저 저장 공간을 확인해 주세요.')}detail();toast(name+' 경비를 저장했어요! 🌼')});
document.addEventListener('change',e=>{if(e.target?.id!=='tripCurrency')return;if(collabId&&collabRole==='viewer'){toast('보기 전용 여행이에요.');render();return}const t=selected(detailId),currency=e.target.value;if(!t||!Object.hasOwn(MOA_CURRENCIES,currency))return;t.localCurrency=currency;if(save()){detail();toast('여행지 기본 통화를 변경했어요.')}});
