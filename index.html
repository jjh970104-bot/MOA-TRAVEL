/* MOA v1.1 — playful, compact planner */
:root{--peach:#f8e6d6;--mint:#e7f2e8;--pink:#f8e9ee}
.brandmark{border-radius:16px 16px 14px 16px;box-shadow:2px 3px 0 #bdd5be;transform:rotate(-9deg)}
.primary,.secondary,.daytab,.filter{border-radius:17px;transition:transform .16s,box-shadow .16s}
.primary:hover,.secondary:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(68,104,79,.09)}
.heroart{border-radius:42px}.feature{border-radius:27px}.trip{border-radius:29px;transition:transform .2s}.trip:hover{transform:translateY(-4px)}
.panel{border-radius:27px}.detailhero{border-radius:30px;position:relative;overflow:hidden}.detailhero:after{content:'✦';position:absolute;right:95px;top:13px;color:#b3cbad;font-size:27px}
.softtag{display:inline-flex;background:#fff6eb;color:#98744f;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}
.modebar{display:flex;gap:7px;background:#f1f5ef;padding:6px;border-radius:19px;margin:16px 0 20px}
.modebar button{flex:1;border:0;background:transparent;padding:12px 8px;border-radius:14px;color:#688071;font-weight:800}
.modebar button.active{background:white;color:var(--greenDark);box-shadow:0 3px 12px #344b3610}
.plannerTabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:thin}.plannerTabs button{white-space:nowrap;flex-shrink:0;border:1px solid #dae7da;background:white;color:#6b8274;padding:10px 14px;border-radius:15px;font-size:13px;font-weight:700}.plannerTabs button.active{background:#4f7b64;color:white;border-color:#4f7b64}
.plannerGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.75fr);gap:18px;margin:20px 0 72px}.plannerMain,.plannerSide{min-width:0}.plannerSide .panel{margin-bottom:14px}
.entry{border:1px solid #e7ece5;border-radius:17px;padding:15px;margin:10px 0;background:#fff;display:flex;gap:11px;align-items:flex-start;min-width:0}.entry .em{background:#eff5ec;border-radius:13px;padding:5px 6px;font-size:15px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:39px}.entrybody{flex:1;min-width:0;overflow-wrap:anywhere}.entrybody strong{font-size:14px}.entrybody p{font-size:12px;color:#77877c;line-height:1.75;margin:6px 0 0}.entryactions{display:flex;gap:2px;flex-shrink:0}.entryactions button{border:0;background:#f4f7f2;color:#688272;border-radius:10px;padding:8px;font-size:13px}
.statusChip{font-size:11px;border-radius:30px;background:#fff1df;color:#97743e;padding:4px 8px;margin-left:5px;font-weight:700}.doneText{text-decoration:line-through;color:#a1aaa0}.tinyHint{font-size:12px;color:#8c9a8d;line-height:1.8}.emptyMini{padding:38px 15px;text-align:center;background:#fafcf9;border:1px dashed #d5e5d5;border-radius:18px;font-size:13px;color:#849789}.actionrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.miniStat{display:flex;align-items:center;gap:8px;padding:12px;background:#f4f8f2;border-radius:15px;color:#50745a;font-size:13px;font-weight:700}
.list-check{width:20px;height:20px;accent-color:#537d64;flex-shrink:0;cursor:pointer}.listrow{display:flex;align-items:center;gap:11px;border-bottom:1px solid #edf1eb;padding:13px 3px;min-width:0}.listrow label{flex:1;font-size:13px;overflow-wrap:anywhere}.amount{font-weight:800;color:#486e57;font-variant-numeric:tabular-nums}.moneybar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.moneybar>div{background:#f3f7f1;border-radius:16px;padding:14px}.moneybar b{display:block;margin-top:6px;font-size:17px}.moneybar small{color:#879888;font-size:11px}.responsiveTable{overflow-x:auto}.responsiveTable table{border-collapse:collapse;width:100%;min-width:470px;font-size:12px}.responsiveTable th,.responsiveTable td{padding:12px 9px;text-align:left;border-bottom:1px solid #e6ebe5;vertical-align:middle}.responsiveTable th{background:#f5f8f2;color:#6d806f}.responsiveTable button{border:0;background:#eef4ec;color:#54725e;border-radius:8px;padding:6px 9px}.mobileModeNote{background:#fff7eb;border-radius:15px;padding:13px;color:#947b60;font-size:12px;margin-bottom:14px}
@media(max-width:800px){.plannerGrid{grid-template-columns:1fr}.plannerSide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.plannerSide .panel{margin:0}.detailhero{padding:23px}.modebar{margin-top:12px}}
@media(max-width:540px){.plannerSide{grid-template-columns:1fr}.plannerTabs button{padding:11px}.moneybar{gap:6px}.moneybar>div{padding:10px}.moneybar b{font-size:13px}.entry{padding:12px}.detailhero h1{font-size:23px}}

/* MOA V1.2 — buddy mascot and dependable expense entry */
.moa-buddy{position:absolute;z-index:5;left:48%;bottom:48px;transform:translateX(-50%) rotate(-5deg);width:142px;height:183px;filter:drop-shadow(0 16px 12px rgba(42,83,50,.15));animation:buddyBob 4s ease-in-out infinite}
.buddy-handle{position:absolute;width:62px;height:29px;border:11px solid #54816e;border-bottom:0;border-radius:23px 23px 0 0;top:1px;left:40px}
.buddy-body{position:absolute;left:8px;top:21px;width:126px;height:133px;background:#f7d6a2;border:5px solid #5e826a;border-radius:29px 31px 27px 30px;box-shadow:inset -11px -9px 0 #edc28e,4px 6px 0 #7baf8e;display:flex;justify-content:center;align-items:center}
.buddy-eyes{display:flex;gap:30px;position:absolute;top:50px}.buddy-eyes i{width:9px;height:12px;background:#344c40;border-radius:50%;display:block}.buddy-cheeks{position:absolute;color:#ed9e9f;font-size:14px;top:65px;left:25px;letter-spacing:9px;white-space:pre}.buddy-smile{border:3px solid #446b54;border-top:0;border-radius:0 0 15px 15px;width:20px;height:11px;position:absolute;top:79px;left:50px}.buddy-sticker{position:absolute;left:17px;top:12px;font-size:20px;color:#fff9ee;transform:rotate(-12deg)}
.buddy-foot{position:absolute;background:#5c826b;border-radius:0 0 10px 10px;width:21px;height:20px;bottom:13px}.buddy-foot.one{left:31px}.buddy-foot.two{right:30px}
.buddy-speech{position:absolute;right:-79px;top:-13px;background:#fffefa;border:2px solid #c6dec6;border-radius:21px 21px 21px 5px;color:#5a7865;font-size:12px;font-weight:800;padding:10px 14px;white-space:nowrap;transform:rotate(7deg)}
@keyframes buddyBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-5deg)}50%{transform:translateX(-50%) translateY(-8px) rotate(-2deg)}}
.quickExpense{background:linear-gradient(140deg,#f1f7ed,#fff9ef);border:1px solid #dfe9d9;border-radius:22px;padding:19px;margin:18px 0 22px}.quickExpenseTitle{font-weight:800;font-size:16px;margin-bottom:14px}.quickExpenseTitle span{display:block;font-weight:500;color:#819080;font-size:12px;margin-top:5px}.quickExpenseFields{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;align-items:end;gap:10px}.quickExpenseFields label{font-size:12px;color:#597363;font-weight:800;min-width:0}.quickExpenseFields input:not([type=checkbox]){display:block;min-width:0;width:100%;margin-top:7px;border:1px solid #d9e3d9;border-radius:12px;padding:12px 10px;background:#fff;color:#293c34;font-size:13px}.quickExpenseFields .quickCheck{display:flex;gap:5px;align-items:center;white-space:nowrap;padding-bottom:13px}.quickCheck input{accent-color:#5e876a;width:17px;height:17px}.expenseSubmit{margin-top:14px;width:100%}.formError{color:#a14536;font-size:12px;margin:12px 0 0}
@media(max-width:840px){.quickExpenseFields{grid-template-columns:1fr 1fr}.quickExpenseFields .quickCheck{padding:9px 0}}
@media(max-width:540px){.quickExpenseFields{grid-template-columns:1fr}.quickExpense{padding:15px}.moa-buddy{left:46%;bottom:38px;transform:translateX(-50%) scale(.8);animation:none}.buddy-speech{right:-50px;font-size:10px}}
@media(prefers-reduced-motion:reduce){.moa-buddy{animation:none}}

/* V1.3: compact itinerary, route preview, and mobile travel controls */
.routePreview{background:linear-gradient(135deg,#f0f6ea,#fff9ee);border:1px solid #e1e9dc;border-radius:19px;padding:16px;margin:14px 0 18px}
.routeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.routeTop strong{font-size:14px}.routeTop small{color:#718375;font-size:11px}
.routeStops{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}
.routeStop{display:inline-flex;gap:7px;align-items:center;max-width:100%;background:#fff;border:1px solid #dfe9d9;padding:7px 10px;border-radius:30px;font-size:12px;font-weight:700;color:#4b6855}
.routeStop .routeNumber{background:#6e9b7b;color:white;width:19px;height:19px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px}
.routeDivider{color:#9ab49c;font-size:13px}.routeNote{color:#879383;font-size:11px;line-height:1.6;margin:6px 0}
.entry{transition:background .15s;border-radius:13px}.entry:hover{background:#fbfdf9}.entry .em{flex:none}.entrybody{min-width:0;flex:1}.entrybody p{line-height:1.6;overflow-wrap:anywhere}.entryactions{flex-shrink:0}
.dayStatus{margin-left:9px;font-size:10px;opacity:.85}.daytab{white-space:nowrap}.dayline{overflow-x:auto;flex-wrap:nowrap;padding-bottom:7px;scrollbar-width:thin}

<script>
(function(){'use strict';
const STORAGE_KEY='moa-v1-trips-independent-2026';const app=document.getElementById('app');const modalRoot=document.getElementById('modalRoot');let page='home',filter='all',detailId=null,detailDay=0,plannerTab='schedule',plannerMode='plan';let trips=[];let pendingShareId=null,pendingCollabToken=null,collabId=null,collabMeta=null,collabStops=[],collabStopUnsub=null,collabMetaUnsub=null,collabMemberUnsub=null,collabRole=null,collabList=[],collabListUnsub=null,sharedTrip=null,sharedBase=null,sharedStateUnsub=null,sharedDirty=false,sharedBusy=false,sharedTimer=null,sharedEditVersion=0,sharedStateRef=null,sharedSaveFailed=false,sharedDeferredRemote=null;let routeMap=null,placeSearchTimer=null,placeSearchResults=[],placeSelected=null,cloudUser=null,cloudActive=false,cloudListener=null,cloudRef=null,cloudTimer=null,cloudPending=false,cloudBusy=false,cloudApplying=false,cloudAuthReady=false;const MAP_KEY='moa-geoapify-api-key-v1';
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');trips=Array.isArray(saved)?saved.filter(t=>t&&typeof t.id==='string'):[]}catch(e){console.warn('저장된 데이터 읽기 실패',e);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){
  if(collabId&&detailId==='collab:'+collabId){
    if(!['owner','editor'].includes(collabRole)){toast('보기 전용 여행이라 수정할 수 없어요.');sharedTrip=sharedClone(sharedBase);render();return false}
    if(!sharedTrip||!sharedBase){toast('공동 여행 연결을 확인해 주세요.');return false}
    sharedDirty=true;sharedSaveFailed=false;sharedEditVersion++;scheduleSharedSave();return true;
  }
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(trips));if(cloudActive&&!cloudApplying)queueCloudSave();return true}
  catch(e){toast('저장에 실패했어요. 저장 공간을 확인해 주세요.');return false}
}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>r.innerHTML='',3000)}
function parseDate(d){let a=String(d||'').split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)}
function days(t){const n=Math.round((parseDate(t.end)-parseDate(t.start))/86400000)+1;return Number.isFinite(n)&&n>0?Math.min(n,120):1}
function fmt(d){return String(d||'').replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1.$2.$3')}
function duration(t){return `${fmt(t.start)} – ${fmt(t.end)} · ${days(t)-1}박 ${days(t)}일`}
function selected(t){if(collabId&&t==='collab:'+collabId)return sharedTrip;return trips.find(x=>x.id===t)}
function theme(t){return ({sea:['#b9d9d4','#e5eee7','🏝️'],mountain:['#b8d0b1','#eff0d9','⛰️'],city:['#dfd6c8','#f3e5d0','🏙️'],nature:['#c8d7ba','#eee4bb','🌿'],spring:['#ead3db','#f4e7db','🌸']})[t.theme]||['#c4dbca','#f4e5cd','✈️']}
function cover(t){const c=theme(t);return `<div class="cover" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span class="symbol">${c[2]}</span></div>`}
function card(t){const linkedId=t.collabId||collabList.find(c=>c.sourceTripId===t.id)?.id;return `<article class="trip">${cover(t)}<div class="tripbody"><span class="badge ${t.status==='done'?'done':''}">${linkedId?'👥 함께하는 여행':t.status==='done'?'✓ 다녀온 여행':'✦ 계획 중'}</span><h3>${esc(t.title)}</h3><p>📍 ${esc(t.destination)}<br>📅 ${duration(t)}</p><div class="tripfoot"><span class="tiny muted">👥 ${Number(t.people)||1}명 · ${esc(t.type)}</span><button class="textbtn" ${linkedId?`data-open-collab="${esc(linkedId)}"`:`data-detail="${esc(t.id)}"`}>여행 열기 ↗</button></div></div></article>`}
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">Collect your moments, together</span><h1>여행의 모든 순간,<br><em>모아</em>서 더 특별하게.</h1><p>설레는 여행 계획부터 함께 만드는 일정, 소중한 추억까지.<br>당신의 여행이 시작되고 쌓이는 공간, 모아.</p><div class="heroactions"><button class="primary" data-create>나의 여행 만들기 ↗</button><button class="secondary" data-nav="dashboard">내 여행 둘러보기</button></div><p style="margin-top:17px;font-size:12px">☁️ 로그인 후 클라우드에 여행을 저장하고 초대 링크로 공유할 수 있어요.</p></div><div class="heroart" aria-label="언덕과 햇살을 표현한 여행 일러스트"><div class="sun"></div><div class="mountain back"></div><div class="mountain"></div><div class="mountain front"></div><div class="moa-buddy" aria-label="웃는 여행 가방 캐릭터 모모" role="img"><div class="buddy-handle"></div><div class="buddy-body"><span class="buddy-sticker">✿</span><span class="buddy-eyes"><i></i><i></i></span><span class="buddy-cheeks">●　　　●</span><span class="buddy-smile"></span></div><span class="buddy-foot one"></span><span class="buddy-foot two"></span><div class="buddy-speech">여행 준비, 모아랑! ♡</div></div><span class="spark">✦</span><div class="floatcard left"><strong>📍 다음 여행, 어디로?</strong><span>마음이 가는 곳부터 시작해요</span></div><div class="floatcard right"><strong>🧳 함께 만드는 여행</strong><span>계획부터 추억까지 한곳에</span></div></div></section><section class="section"><div class="secthead"><div><span class="eyebrow">Why MOA?</span><h2>여행 준비, 더 간편하고 즐겁게</h2></div></div><div class="features"><div class="feature"><div class="fi">🗓️</div><h3>한눈에 보는 여행 계획</h3><p>여행지와 날짜부터 일정까지, 복잡하지 않게 차곡차곡 정리해요.</p></div><div class="feature"><div class="fi">👫</div><h3>함께 만드는 여행</h3><p>친구나 연인과 하나의 계획표를 함께 완성해요. 초대 기능은 다음 버전에서 제공돼요.</p></div><div class="feature"><div class="fi">💌</div><h3>추억을 나누는 커뮤니티</h3><p>다른 여행자의 이야기에서 영감을 받아요. 커뮤니티는 다음 버전에서 만나요.</p></div></div></section><div class="bottom-banner"><div><h2>어디로 떠날지 정했나요?</h2><p>여행지를 적는 순간, 새로운 이야기가 시작돼요.</p></div><button class="primary" data-create>＋ 새 여행 시작하기</button></div>`}
function dashboard(){const shown=trips.filter(t=>filter==='all'||t.status===filter),ownedCollabs=new Set(collabList.filter(c=>trips.some(t=>t.collabId===c.id||c.sourceTripId===t.id)).map(c=>c.id).concat(trips.filter(t=>t.collabId).map(t=>t.collabId))),sharedCollabs=collabList.filter(c=>!ownedCollabs.has(c.id)),planned=trips.filter(t=>t.status==='planning').length,done=trips.filter(t=>t.status==='done').length;app.innerHTML=`<div class="pagehead"><div><span class="eyebrow">My travel collection</span><h1>내 여행 모아보기 🌿</h1><p>떠날 여행도, 다녀온 추억도 한곳에서 관리해요.</p></div><button class="primary" data-create>＋ 새 여행</button></div><div class="stats"><div class="stat"><span class="sub">전체 여행</span><div class="num">${trips.length}</div></div><div class="stat"><span class="sub">계획 중</span><div class="num">${planned}</div></div><div class="stat"><span class="sub">다녀온 여행</span><div class="num">${done}</div></div></div><div class="secthead"><div><h2>나의 여행</h2></div><div class="actionrow"><button class="secondary" data-import style="font-size:12px;padding:10px">↑ 백업 불러오기</button><button class="secondary" data-export style="font-size:12px;padding:10px">↓ 백업 내보내기</button></div></div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">전체 ${trips.length}</button><button class="filter ${filter==='planning'?'active':''}" data-filter="planning">계획 중 ${planned}</button><button class="filter ${filter==='done'?'active':''}" data-filter="done">다녀온 여행 ${done}</button></div><div class="tripgrid">${(shown.length||sharedCollabs.length)?shown.map(card).join('')+sharedCollabs.map(c=>'<article class="trip"><div class="tripbody"><span class="badge">👥 함께하는 여행</span><h3>'+esc(c.title||'여행')+'</h3><p>📍 '+esc(c.destination||'')+'</p><div class="tripfoot"><span class="tiny muted">초대받은 여행</span><button class="textbtn" data-open-collab="'+esc(c.id)+'">여행 열기 ↗</button></div></div></article>').join(''):`<div class="empty"><div class="large">🧳🌷</div><h3>${filter==='all'?'아직 만든 여행이 없어요':'해당하는 여행이 없어요'}</h3><p>가고 싶은 여행지부터 등록해볼까요?</p><button class="primary" data-create style="margin-top:13px">첫 여행 만들기</button></div>`}${shown.length?'<button class="newtripCard" data-create><span class="plus">＋</span><strong>새 여행 만들기</strong><span class="tiny muted">다음 설렘을 채워주세요</span></button>':''}</div>`}
function coming(kind){const isExplore=kind==='explore';app.innerHTML=`<section class="coming"><div class="large">${isExplore?'🗺️':'💌'}</div><span class="eyebrow">Coming in the next version</span><h1>${isExplore?'다른 여행자의 일정을 발견하는 곳':'여행 이야기가 모이는 곳'}</h1><p>${isExplore?'도시·여행 스타일별로 일정을 찾아보고 내 여행으로 복사하는 기능을 준비 중이에요.':'사진, 후기, 좋아요, 댓글로 여행 꿀팁을 공유하는 공간을 준비 중이에요.'}<br>현재 V1.5는 개인 여행 플래너를 사용할 수 있는 로컬 시제품이에요.</p><button class="primary" data-nav="dashboard">내 여행으로 돌아가기</button></section>`}
function uuid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():`item-${Date.now()}-${Math.random().toString(36).slice(2,8)}`}
function ensureTrip(t){for(const k of ['stops','expenses','shopping','checklist','stays','transportBookings'])if(!Array.isArray(t[k]))t[k]=[]}
function money(n){return new Intl.NumberFormat('ko-KR').format(Number(n)||0)}
function formatStop(s){return [s.time||'시간 미정',s.transport?`🚶 ${s.transport}`:'',s.address||'',s.note||''].filter(Boolean).map(esc).join(' · ')}
function plannerNav(){return `<div class="plannerTabs" aria-label="플래너 메뉴">${[['schedule','🗓️ 일정'],['stays','🏨 숙소'],['transport','✈️ 교통'],['expense','💰 경비'],['shopping','🛍️ 쇼핑'],['checklist','✅ 준비물']].map(([k,l])=>`<button data-planner-tab="${k}" class="${plannerTab===k?'active':''}">${l}</button>`).join('')}</div>`}
function dayStops(t){return t.stops.filter(s=>Number(s.day)===detailDay).sort((a,b)=>{if(Number.isFinite(a.order)&&Number.isFinite(b.order))return a.order-b.order;if(Number.isFinite(a.order))return -1;if(Number.isFinite(b.order))return 1;return (a.time||'99:99').localeCompare(b.time||'99:99')})}

function itineraryEntries(t){
  const date=isoForDay(t,detailDay);
  const stays=(t.stays||[]).filter(x=>x.checkIn<=date&&x.checkOut>=date)
    .sort((a,b)=>(a.checkIn||'').localeCompare(b.checkIn||''))
    .map(x=>({kind:'stay',id:x.id,name:'🏨 '+x.name,address:x.address||'',lat:x.lat,lon:x.lon,
       note:date===x.checkIn?'체크인 '+(x.checkInTime||'시간 미정'):date===x.checkOut?'체크아웃 '+(x.checkOutTime||'시간 미정'):'숙박 중',
       source:x,candidate:false}));
  const rides=(t.transportBookings||[]).filter(x=>x.date===date)
    .sort((a,b)=>(a.depart||'99:99').localeCompare(b.depart||'99:99'))
    .map(x=>({kind:'transport',id:x.id,name:(x.type||'🚆 교통')+' · '+(x.from||'출발지')+' → '+(x.to||'도착지'),
       address:x.from||'',lat:x.lat,lon:x.lon,note:[x.depart&&'출발 '+x.depart,x.arrive&&'도착 '+x.arrive,x.code].filter(Boolean).join(' · '),
       source:x,candidate:false}));
  const ordinary=dayStops(t).map(x=>({kind:'stop',id:x.id,name:x.name,address:x.address||'',
       lat:x.lat,lon:x.lon,note:formatStop(x),source:x,candidate:!!x.candidate}));
  // Arrival day: transport to destination comes before hotel check-in.
  // Departure day: hotel check-out and planned stops come before homebound transport.
  // On intermediate days, the hotel remains the starting anchor.
  const firstDay=detailDay===0, finalDay=detailDay===days(t)-1;
  const defaults=firstDay?[...rides,...stays,...ordinary]:finalDay?[...stays,...ordinary,...rides]:[...stays,...rides,...ordinary];
  const saved=t.dayOrders?.[date];
  if(!Array.isArray(saved))return defaults;
  const available=new Map(defaults.map(x=>[x.kind+':'+x.id,x])),ordered=[];
  for(const key of saved){if(available.has(key)){ordered.push(available.get(key));available.delete(key)}}
  return [...ordered,...available.values()];
}
function itemOrderKey(x){return x.kind+':'+x.id}
function saveItineraryOrder(t,items){
  const date=isoForDay(t,detailDay);
  if(!t.dayOrders||typeof t.dayOrders!=='object'||Array.isArray(t.dayOrders))t.dayOrders={};
  t.dayOrders[date]=items.map(itemOrderKey);
  return save();
}
function reorderItinerary(fromKey,toKey){
  const t=selected(detailId);if(!t||fromKey===toKey)return;
  const items=itineraryEntries(t),i=items.findIndex(x=>itemOrderKey(x)===fromKey),j=items.findIndex(x=>itemOrderKey(x)===toKey);
  if(i<0||j<0)return;
  const [moved]=items.splice(i,1);items.splice(j,0,moved);
  if(saveItineraryOrder(t,items)){detail();toast('방문 순서를 변경했어요 🌿')}
}
function stepItinerary(key,direction){
  const t=selected(detailId);if(!t)return;
  const items=itineraryEntries(t),i=items.findIndex(x=>itemOrderKey(x)===key),j=i+direction;
  if(i<0||j<0||j>=items.length)return;
  [items[i],items[j]]=[items[j],items[i]];
  if(saveItineraryOrder(t,items))detail();
}
function locationAvailable(x){return x.lat!=null&&x.lon!=null&&x.lat!==''&&x.lon!==''&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lon))}

function mountRouteMap(){const el=document.getElementById('routeMapCanvas');if(!el||!window.L)return;try{if(routeMap){routeMap.remove();routeMap=null}routeMap=L.map(el,{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(routeMap);const t=selected(detailId),points=t?itineraryEntries(t).filter(s=>!s.candidate&&locationAvailable(s)):[];if(points.length){const coords=points.map(s=>[Number(s.lat),Number(s.lon)]);points.forEach((s,i)=>{const seq=itineraryEntries(t).filter(e=>!e.candidate).findIndex(e=>e.kind===s.kind&&e.id===s.id)+1;const icon=L.divIcon({className:'',html:'<span class="routePin">'+seq+'</span>',iconSize:[26,26],iconAnchor:[13,13]});L.marker(coords[i],{icon}).addTo(routeMap).bindPopup(esc(s.name))});if(coords.length>1)L.polyline(coords,{color:'#649778',weight:4,opacity:.85,dashArray:'8 7'}).addTo(routeMap);routeMap.fitBounds(L.latLngBounds(coords).pad(.22),{maxZoom:14})}else routeMap.setView([37.5665,126.978],3);setTimeout(()=>routeMap?.invalidateSize(),180)}catch(err){console.warn('Map not available',err);el.innerHTML='<div class="emptyMini">지도를 불러올 수 없어요. 네트워크를 확인해 주세요.</div>'}}

function sharedClone(o){return o==null?o:JSON.parse(JSON.stringify(o))}
function sharedEqual(a,b){return JSON.stringify(a)===JSON.stringify(b)}
const SHARED_ARRAYS=['stops','expenses','shopping','checklist','stays','transportBookings'];
function sharedDiff(base,working){
  const delta={fields:{},collections:{}};
  const keys=new Set([...Object.keys(base||{}),...Object.keys(working||{})]);
  for(const k of keys){
    if(SHARED_ARRAYS.includes(k)||['id','collabId','shareId','createdAt'].includes(k))continue;
    if(k==='dayOrders'){
      const changes={};for(const d of new Set([...Object.keys(base?.dayOrders||{}),...Object.keys(working?.dayOrders||{})])){
        if(!sharedEqual(base?.dayOrders?.[d],working?.dayOrders?.[d]))changes[d]=working?.dayOrders?.[d]===undefined?null:sharedClone(working.dayOrders[d]);
      }
      if(Object.keys(changes).length)delta.fields.dayOrders=changes;
    }else if(!sharedEqual(base?.[k],working?.[k]))delta.fields[k]=working?.[k]===undefined?null:sharedClone(working[k]);
  }
  for(const col of SHARED_ARRAYS){
    const old=new Map((base?.[col]||[]).filter(x=>x?.id).map(x=>[x.id,x]));
    const current=new Map((working?.[col]||[]).filter(x=>x?.id).map(x=>[x.id,x]));
    const edits={};
    for(const [id,item] of current){
      if(!old.has(id)){edits[id]={new:sharedClone(item)};continue}
      const previous=old.get(id),fields={};
      for(const k of new Set([...Object.keys(previous),...Object.keys(item)])){
        if(!sharedEqual(previous[k],item[k]))fields[k]=item[k]===undefined?null:sharedClone(item[k]);
      }
      if(Object.keys(fields).length)edits[id]={fields};
    }
    for(const id of old.keys())if(!current.has(id))edits[id]={remove:true};
    if(Object.keys(edits).length)delta.collections[col]=edits;
  }
  return delta;
}
function applySharedDiff(remote,delta){
  const merged=sharedClone(remote||{});
  for(const [k,v] of Object.entries(delta.fields)){
    if(k==='dayOrders'){
      merged.dayOrders=merged.dayOrders||{};
      for(const [day,order] of Object.entries(v)){if(order===null)delete merged.dayOrders[day];else merged.dayOrders[day]=order}
    }else if(v===null)delete merged[k];else merged[k]=sharedClone(v);
  }
  for(const [col,edits] of Object.entries(delta.collections)){
    const items=(merged[col]||[]).map(x=>sharedClone(x));
    for(const [id,change] of Object.entries(edits)){
      const i=items.findIndex(x=>x.id===id);
      if(change.remove){if(i>=0)items.splice(i,1)}
      else if(change.new){if(i<0)items.push(sharedClone(change.new));else items[i]={...items[i],...sharedClone(change.new)}}
      else if(i>=0){for(const [k,v] of Object.entries(change.fields)){if(v===null)delete items[i][k];else items[i][k]=sharedClone(v)}}
    }
    merged[col]=items;
  }
  return merged;
}
function scheduleSharedSave(){
  if(!collabId||!sharedStateRef||!sharedDirty||sharedSaveFailed)return;
  clearTimeout(sharedTimer);sharedTimer=setTimeout(flushSharedSave,420);
}
async function flushSharedSave(){
  if(!collabId||!sharedStateRef||sharedBusy||!sharedDirty||!sharedBase||!sharedTrip)return;
  const ref=sharedStateRef,id=collabId,base=sharedClone(sharedBase),next=sharedClone(sharedTrip),version=sharedEditVersion;
  const delta=sharedDiff(base,next);
  if(!Object.keys(delta.fields).length&&!Object.keys(delta.collections).length){sharedDirty=false;return}
  sharedBusy=true;
  try{
    let merged=null;
    await setupCloud().db.runTransaction(async transaction=>{
      const snap=await transaction.get(ref);
      if(!snap.exists||!snap.data()?.trip)throw Error('공동 여행 저장 문서가 없어요.');
      merged=applySharedDiff(snap.data().trip,delta);
      transaction.update(ref,{trip:merged,updatedBy:cloudUser.uid,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    if(collabId!==id)return;
    sharedBase=sharedClone(merged);sharedDeferredRemote=null;
    if(sharedEditVersion===version){sharedTrip=sharedClone(merged);sharedDirty=false;sharedSaveFailed=false}
    else sharedDirty=true;
    toast('☁️ 함께하는 여행 저장 완료');
  }catch(e){if(collabId===id){sharedDirty=true;sharedSaveFailed=true;toast('⚠️ 공동 여행 저장 실패: '+(e.code||e.message)+' · 다시 저장을 눌러줘.')}}
  finally{sharedBusy=false;if(collabId===id&&sharedDirty&&!sharedSaveFailed)scheduleSharedSave()}
}
async function openCollab(id){

    if(!/^[A-Za-z0-9_-]{8,128}$/.test(id))throw Error('잘못된 여행 주소예요.');
    const {db}=setupCloud(),ref=db.collection('collabTrips').doc(id);
    const member=await ref.collection('members').doc(cloudUser.uid).get();
    if(!member.exists)throw Error('이 여행에 참여 중인 계정이 아니에요.');
    const stateRef=ref.collection('state').doc('current');

        const copy=sharedClone(previous);delete copy.collabId;

    leaveCollab();collabId=id;collabRole=member.data()?.role||'viewer';sharedStateRef=stateRef;

    detailId='collab:'+id;detailDay=0;plannerTab='schedule';plannerMode='plan';page='dashboard';closeModal();render();
    collabMemberUnsub=ref.collection('members').doc(cloudUser.uid).onSnapshot(doc=>{

      if(!doc.exists){toast('공동 여행 참여 권한이 종료됐어요.');leaveCollab();nav('dashboard');return}
      collabRole=doc.data().role||'viewer';render();
    },e=>{toast('동행자 권한 확인 실패: '+(e.code||e.message));leaveCollab();nav('dashboard')});
    collabMetaUnsub=ref.onSnapshot(doc=>{

      collabMeta=doc.data();
    },e=>{toast('공동 여행 연결 오류: '+(e.code||e.message));leaveCollab();nav('dashboard')});
    sharedStateUnsub=stateRef.onSnapshot(snap=>{
      if(collabId!==id||!snap.exists||!snap.data()?.trip||snap.metadata.hasPendingWrites)return;

        if(modalRoot.querySelector('#overlay')){sharedDeferredRemote=sharedClone(incoming);return}
        sharedBase=sharedClone(incoming);sharedTrip=sharedClone(incoming);render();
      }
    },e=>toast('공동 여행 동기화 실패: '+(e.code||e.message)));
  }catch(e){toast('공동 여행 열기 실패: '+(e.code||e.message))}
}

  '<div class="actionrow"><button class="primary" type="button" id="makeTripShare">🔗 초대 링크 만들기 / 최신 내용 반영</button></div>'+
  (t.shareId?'<div class="actionrow"><button class="secondary mini" type="button" id="copyTripShare">링크 복사</button><button class="secondary mini" type="button" id="revokeTripShare">공유 중단</button></div>':'')+
  '<p class="apiHelp" id="shareNotice">'+(t.shareId?'이미 만든 공유 링크가 있어요.':'아직 이 여행의 공유 링크를 만들지 않았어요.')+'</p>');
  document.getElementById('makeTripShare').onclick=()=>publishTripShare(t);
  if(t.shareId){
    document.getElementById('copyTripShare').onclick=()=>copyShareLink(t.shareId);
    document.getElementById('revokeTripShare').onclick=()=>revokeTripShare(t);
  }
}
function shareLink(id){return location.origin+location.pathname+'#share='+encodeURIComponent(id)}
async function copyShareLink(id){
  const link=shareLink(id);
  try{await navigator.clipboard.writeText(link);toast('초대 링크를 복사했어요! 🌷')}
  catch(e){prompt('초대 링크를 복사해 주세요.',link)}
}
async function publishTripShare(t){
  const b=document.getElementById('makeTripShare');if(b)b.disabled=true;
  try{
    const {db,auth}=setupCloud();
    if(!auth.currentUser||!userVerified())throw Error('이메일 인증된 계정이 필요해요.');
    await auth.currentUser.getIdToken(true);
    const shareRef=t.shareId?db.collection('tripShares').doc(t.shareId):db.collection('tripShares').doc();
    const shareCopy=JSON.parse(JSON.stringify(t));delete shareCopy.shareId;
    const doc={ownerUid:cloudUser.uid,trip:shareCopy,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(t.shareId){
      const prev=await shareRef.get();
      if(!prev.exists||prev.data()?.ownerUid!==cloudUser.uid)throw Error('기존 링크를 사용할 수 없어요. 공유 중단 후 새 링크를 생성해 주세요.');
    }
    await shareRef.set(doc);
    if(!t.shareId){t.shareId=shareRef.id;save()}
    await copyShareLink(shareRef.id);
    shareTripModal();
  }catch(e){shareStatusMessage(e)}
  finally{if(b)b.disabled=false}
}
async function revokeTripShare(t){
  if(!confirm('이 여행의 공유 링크를 비활성화할까요? 이미 복사한 여행은 삭제되지 않아요.'))return;
  try{
    if(!t.shareId)return;
    const {db}=setupCloud();
    await db.collection('tripShares').doc(t.shareId).delete();
    delete t.shareId;save();shareTripModal();toast('공유 링크를 비활성화했어요.');
  }catch(e){shareStatusMessage(e)}
}
async function openSharedTrip(id){
  if(!/^[A-Za-z0-9_-]{8,128}$/.test(id||'')){toast('올바른 초대 링크가 아니에요.');return}
  if(!cloudUser||!userVerified()){
    pendingShareId=id;
    accountModal();toast('초대 여행을 보려면 로그인하고 이메일 인증을 해 주세요.');return;
  }
  try{
    const {db}=setupCloud();
    const snap=await db.collection('tripShares').doc(id).get();
    const t=snap.data()?.trip;
    if(!snap.exists||!t||typeof t.title!=='string'||typeof t.start!=='string'||typeof t.end!=='string')throw Error('공유가 종료되었거나 링크가 올바르지 않아요.');
    pendingShareId=null;
    modal('<div class="modalhead"><h2>💌 초대받은 여행</h2><button class="iconbtn" data-close>×</button></div>'+
      '<div class="cloudNotice"><b>'+esc(t.title)+'</b><br>📍 '+esc(t.destination||'')+'<br>📅 '+esc(duration(t))+'<br>👥 '+(Number(t.people)||1)+'명</div>'+
      '<p class="apiHelp">이 링크는 공유 시점의 여행 복사본이에요. 내 여행으로 가져오면 내 계정에서 따로 편집할 수 있고, 원본 여행에는 영향을 주지 않아요.</p>'+
      '<div class="actionrow"><button class="primary" id="acceptSharedTrip">🌷 내 여행으로 복사하기</button></div>');
    document.getElementById('acceptSharedTrip').onclick=()=>{
      if(!confirm('이 여행의 일정·숙소·경비 등 모든 항목을 내 여행으로 복사할까요?'))return;
      const copy=JSON.parse(JSON.stringify(t));
      copy.id=uuid();delete copy.shareId;
      ensureTrip(copy);
      trips.push(copy);
      if(!save()){trips=trips.filter(x=>x.id!==copy.id);return}
      closeModal();detailId=copy.id;page='dashboard';render();history.replaceState(null,'','#dashboard');
      toast('내 여행에 복사했어요! 🌷');
    };
  }catch(e){shareStatusMessage(e)}
}
function checkShareHash(){
  const match=/^#share=([A-Za-z0-9_-]{8,128})$/.exec(location.hash);
  if(match){pendingShareId=match[1];if(cloudUser&&userVerified())openSharedTrip(pendingShareId);else if(cloudAuthReady)openSharedTrip(pendingShareId)}
}
function importData(){const picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';picker.addEventListener('change',async()=>{const file=picker.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),imported=Array.isArray(raw)?raw:raw.trips;if(!Array.isArray(imported)||!imported.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.start==='string'&&typeof t.end==='string'))throw Error('형식 오류');if(!confirm('현재 모아 여행 목록을 백업 파일로 교체할까요? 기존 여행이 있다면 먼저 백업을 다운로드해 주세요.'))return;const previous=trips;trips=imported.map(t=>({...t}));if(!save()){trips=previous;return}detailId=null;page='dashboard';render();toast(imported.length+'개 여행을 불러왔어요! 🌷')}catch(e){toast('올바른 모아 JSON 백업 파일이 아니에요.')}});picker.click()}
function exportData(){const blob=new Blob([JSON.stringify({version:'1.5',app:'moa',exportedAt:new Date().toISOString(),trips},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moa_trips_backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON 백업 파일을 저장했어요.')}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(collabId&&collabRole==='viewer'&&['data-edit','data-add-stop','data-edit-stop','data-delete-stop','data-done-stop','data-step-entry','data-add-stay','data-edit-stay','data-delete-stay','data-add-transport','data-edit-transport','data-delete-transport','data-add-item','data-edit-item','data-delete-item','data-toggle-item','data-toggle','data-delete'].some(a=>el.hasAttribute(a))){toast('이 여행은 보기 전용이에요.');return}if(el.hasAttribute('data-retry-shared')){sharedSaveFailed=false;scheduleSharedSave();toast('공동 여행 저장을 다시 시도해요.');return}if(el.hasAttribute('data-edit-stay')){stayForm(el.dataset.editStay);return}if(el.hasAttribute('data-delete-stay')){const t=selected(detailId);if(confirm('이 숙소를 삭제할까요?')){t.stays=t.stays.filter(x=>x.id!==el.dataset.deleteStay);save();detail()}return}if(el.hasAttribute('data-add-stay')){stayForm();return}if(el.hasAttribute('data-edit-transport')){transportForm(el.dataset.editTransport);return}if(el.hasAttribute('data-delete-transport')){const t=selected(detailId);if(confirm('이 교통편을 삭제할까요?')){t.transportBookings=t.transportBookings.filter(x=>x.id!==el.dataset.deleteTransport);save();detail()}return}if(el.hasAttribute('data-add-transport')){transportForm();return}if(el.hasAttribute('data-account')){accountModal();return}if(el.hasAttribute('data-share-trip')){shareTripModal();return}if(el.hasAttribute('data-start-collab')){addTraveler();return}if(el.hasAttribute('data-add-traveler')){if(collabId){collabInvite();return}addTraveler();return}if(el.hasAttribute('data-collab-list')){showCollabList();return}if(el.hasAttribute('data-open-collab')){openCollab(el.dataset.openCollab);return}if(el.hasAttribute('data-collab-invite')){collabInvite();return}if(el.hasAttribute('data-collab-members')){collabMembers();return}if(el.hasAttribute('data-collab-add')){collabStopForm();return}if(el.hasAttribute('data-collab-edit')){collabStopForm(el.dataset.collabEdit);return}if(el.hasAttribute('data-collab-delete')){deleteCollabStop(el.dataset.collabDelete);return}if(el.hasAttribute('data-collab-leave')){leaveCollab();nav('dashboard');return}if(el.hasAttribute('data-step-entry')){const value=el.dataset.stepEntry,cut=value.lastIndexOf(':');stepItinerary(value.slice(0,cut),Number(value.slice(cut+1)));return}if(el.hasAttribute('data-nav')){nav(el.dataset.nav);return}if(el.hasAttribute('data-create')||el.id==='topCreate'){formTrip();return}if(el.hasAttribute('data-filter')){filter=el.dataset.filter;render();return}if(el.hasAttribute('data-detail')){leaveCollab();detailId=el.dataset.detail;detailDay=0;plannerTab='schedule';plannerMode='plan';render();window.scrollTo(0,0);return}if(el.hasAttribute('data-day')){detailDay=Number(el.dataset.day);render();return}if(el.hasAttribute('data-close')){closeModal();return}if(el.hasAttribute('data-edit')){formTrip(selected(detailId));return}if(el.hasAttribute('data-mode')){plannerMode=el.dataset.mode;render();return}if(el.hasAttribute('data-planner-tab')){plannerTab=el.dataset.plannerTab;render();return}if(el.hasAttribute('data-edit-stop')){formStop(el.dataset.editStop);return}if(el.hasAttribute('data-done-stop')){const t=selected(detailId),s=t?.stops.find(x=>x.id===el.dataset.doneStop);if(s){s.done=!s.done;if(save())detail()}return}if(el.hasAttribute('data-route-map')){openDayRoute();return}if(el.hasAttribute('data-map')){const s=selected(detailId)?.stops.find(x=>x.id===el.dataset.map);if(s?.address){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address),'_blank','noopener,noreferrer')}return}if(el.hasAttribute('data-copy-address')){const s=selected(detailId)?.stops.find(x=>x.id===el.dataset.copyAddress);if(s?.address){navigator.clipboard?.writeText(s.address).then(()=>toast('주소를 복사했어요.')).catch(()=>toast('주소 복사에 실패했어요.'))}return}if(el.hasAttribute('data-add-item')){itemForm(el.dataset.addItem);return}if(el.hasAttribute('data-edit-item')){const [k,id]=el.dataset.editItem.split(':');itemForm(k,id);return}if(el.hasAttribute('data-delete-item')){const [k,id]=el.dataset.deleteItem.split(':'),t=selected(detailId);if(!t||!['expense','shopping','checklist'].includes(k)||!confirm('이 항목을 삭제할까요?'))return;t[collectionKey(k)]=t[collectionKey(k)].filter(x=>x.id!==id);if(save())detail();return}if(el.hasAttribute('data-toggle-item')&&el.tagName==='BUTTON'){const [k,id]=el.dataset.toggleItem.split(':'),t=selected(detailId);const v=t?.[collectionKey(k)]?.find(x=>x.id===id);if(v){v[k==='expense'?'paid':'done']=!v[k==='expense'?'paid':'done'];if(save())detail()}return}if(el.hasAttribute('data-add-stop')){formStop();return}if(el.hasAttribute('data-export')){exportData();return}if(el.hasAttribute('data-import')){importData();return}if(el.hasAttribute('data-toggle')){const t=selected(detailId);t.status=t.status==='done'?'planning':'done';if(save()){render();toast('여행 상태를 변경했어요.')}return}if(el.hasAttribute('data-delete-stop')){const t=selected(detailId);if(!confirm('이 일정을 삭제할까요?'))return;t.stops=t.stops.filter(s=>s.id!==el.dataset.deleteStop);if(save())detail();return}if(el.hasAttribute('data-delete')){if(collabId){toast('공동 여행 전체 삭제는 아직 지원하지 않아요. 여행장에게 문의해 주세요.');return}if(!confirm('이 여행과 등록된 일정을 삭제할까요? 이 작업은 되돌릴 수 없어요.'))return;trips=trips.filter(t=>t.id!==detailId);if(save()){detailId=null;nav('dashboard');toast('여행을 삭제했어요.')}return}});
document.addEventListener('submit',e=>{if(e.target?.id!=='quickStopForm')return;e.preventDefault();if(collabId&&collabRole==='viewer'){toast('보기 전용 여행이에요.');return}const t=selected(detailId);if(!t)return;ensureTrip(t);const f=new FormData(e.target),name=String(f.get('name')||'').trim(),time=String(f.get('time')||'');if(!name)return;const current=dayStops(t);current.forEach((v,i)=>v.order=i);t.stops.push({id:uuid(),day:detailDay,order:current.length,name,time,transport:'',address:'',note:'',candidate:false,done:false});if(!save()){t.stops.pop();return}detail();toast('장소가 추가됐어요! 🌷')});
