/* MOA v1.1 — playful, compact planner */
:root{--peach:#f8e6d6;--mint:#e7f2e8;--pink:#f8e9ee}
.brandmark{border-radius:16px 16px 14px 16px;box-shadow:2px 3px 0 #bdd5be;transform:rotate(-9deg)}
.primary,.secondary,.daytab,.filter{border-radius:17px;transition:transform .16s,box-shadow .16s}
.primary:hover,.secondary:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(68,104,79,.09)}
.heroart{border-radius:42px}.feature{border-radius:27px}.trip{border-radius:29px;transition:transform .2s}.trip:hover{transform:translateY(-4px)}
.panel{border-radius:27px}.detailhero{border-radius:30px;position:relative;overflow:hidden}.detailhero:after{content:'✦';position:absolute;right:95px;top:13px;color:#b3cbad;font-size:27px}
.softtag{display:inline-flex;background:#fff6eb;color:#98744f;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}
.modebar{display:flex;gap:7px;background:#f1f5ef;padding:6px;border-radius:19px;margin:16px 0 20px}
.modebar button{flex:1;border:0;background:transparent;padding:12px 8px;border-radius:14px;color:#688071;font-weight:800}
.modebar button.active{background:white;color:var(--greenDark);box-shadow:0 3px 12px #344b3610}
.plannerTabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:thin}.plannerTabs button{white-space:nowrap;flex-shrink:0;border:1px solid #dae7da;background:white;color:#6b8274;padding:10px 14px;border-radius:15px;font-size:13px;font-weight:700}.plannerTabs button.active{background:#4f7b64;color:white;border-color:#4f7b64}
.plannerGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.75fr);gap:18px;margin:20px 0 72px}.plannerMain,.plannerSide{min-width:0}.plannerSide .panel{margin-bottom:14px}
.entry{border:1px solid #e7ece5;border-radius:17px;padding:15px;margin:10px 0;background:#fff;display:flex;gap:11px;align-items:flex-start;min-width:0}.entry .em{background:#eff5ec;border-radius:13px;padding:10px;font-size:17px;flex-shrink:0}.entrybody{flex:1;min-width:0;overflow-wrap:anywhere}.entrybody strong{font-size:14px}.entrybody p{font-size:12px;color:#77877c;line-height:1.75;margin:6px 0 0}.entryactions{display:flex;gap:2px;flex-shrink:0}.entryactions button{border:0;background:#f4f7f2;color:#688272;border-radius:10px;padding:8px;font-size:13px}
.statusChip{font-size:11px;border-radius:30px;background:#fff1df;color:#97743e;padding:4px 8px;margin-left:5px;font-weight:700}.doneText{text-decoration:line-through;color:#a1aaa0}.tinyHint{font-size:12px;color:#8c9a8d;line-height:1.8}.emptyMini{padding:38px 15px;text-align:center;background:#fafcf9;border:1px dashed #d5e5d5;border-radius:18px;font-size:13px;color:#849789}.actionrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.miniStat{display:flex;align-items:center;gap:8px;padding:12px;background:#f4f8f2;border-radius:15px;color:#50745a;font-size:13px;font-weight:700}
.list-check{width:20px;height:20px;accent-color:#537d64;flex-shrink:0;cursor:pointer}.listrow{display:flex;align-items:center;gap:11px;border-bottom:1px solid #edf1eb;padding:13px 3px;min-width:0}.listrow label{flex:1;font-size:13px;overflow-wrap:anywhere}.amount{font-weight:800;color:#486e57;font-variant-numeric:tabular-nums}.moneybar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.moneybar>div{background:#f3f7f1;border-radius:16px;padding:14px}.moneybar b{display:block;margin-top:6px;font-size:17px}.moneybar small{color:#879888;font-size:11px}.responsiveTable{overflow-x:auto}.responsiveTable table{border-collapse:collapse;width:100%;min-width:470px;font-size:12px}.responsiveTable th,.responsiveTable td{padding:12px 9px;text-align:left;border-bottom:1px solid #e6ebe5;vertical-align:middle}.responsiveTable th{background:#f5f8f2;color:#6d806f}.responsiveTable button{border:0;background:#eef4ec;color:#54725e;border-radius:8px;padding:6px 9px}.mobileModeNote{background:#fff7eb;border-radius:15px;padding:13px;color:#947b60;font-size:12px;margin-bottom:14px}
@media(max-width:800px){.plannerGrid{grid-template-columns:1fr}.plannerSide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.plannerSide .panel{margin:0}.detailhero{padding:23px}.modebar{margin-top:12px}}
@media(max-width:540px){.plannerSide{grid-template-columns:1fr}.plannerTabs button{padding:11px}.moneybar{gap:6px}.moneybar>div{padding:10px}.moneybar b{font-size:13px}.entry{padding:12px}.detailhero h1{font-size:23px}}

/* MOA V1.2 — buddy mascot and dependable expense entry */
.moa-buddy{position:absolute;z-index:5;left:48%;bottom:48px;transform:translateX(-50%) rotate(-5deg);width:142px;height:183px;filter:drop-shadow(0 16px 12px rgba(42,83,50,.15));animation:buddyBob 4s ease-in-out infinite}
.buddy-handle{position:absolute;width:62px;height:29px;border:11px solid #54816e;border-bottom:0;border-radius:23px 23px 0 0;top:1px;left:40px}
.buddy-body{position:absolute;left:8px;top:21px;width:126px;height:133px;background:#f7d6a2;border:5px solid #5e826a;border-radius:29px 31px 27px 30px;box-shadow:inset -11px -9px 0 #edc28e,4px 6px 0 #7baf8e;display:flex;justify-content:center;align-items:center}
.buddy-eyes{display:flex;gap:30px;position:absolute;top:50px}.buddy-eyes i{width:9px;height:12px;background:#344c40;border-radius:50%;display:block}.buddy-cheeks{position:absolute;color:#ed9e9f;font-size:14px;top:65px;left:25px;letter-spacing:9px;white-space:pre}.buddy-smile{border:3px solid #446b54;border-top:0;border-radius:0 0 15px 15px;width:20px;height:11px;position:absolute;top:79px;left:50px}.buddy-sticker{position:absolute;left:17px;top:12px;font-size:20px;color:#fff9ee;transform:rotate(-12deg)}
.buddy-foot{position:absolute;background:#5c826b;border-radius:0 0 10px 10px;width:21px;height:20px;bottom:13px}.buddy-foot.one{left:31px}.buddy-foot.two{right:30px}
.buddy-speech{position:absolute;right:-79px;top:-13px;background:#fffefa;border:2px solid #c6dec6;border-radius:21px 21px 21px 5px;color:#5a7865;font-size:12px;font-weight:800;padding:10px 14px;white-space:nowrap;transform:rotate(7deg)}
@keyframes buddyBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-5deg)}50%{transform:translateX(-50%) translateY(-8px) rotate(-2deg)}}
.quickExpense{background:linear-gradient(140deg,#f1f7ed,#fff9ef);border:1px solid #dfe9d9;border-radius:22px;padding:19px;margin:18px 0 22px}.quickExpenseTitle{font-weight:800;font-size:16px;margin-bottom:14px}.quickExpenseTitle span{display:block;font-weight:500;color:#819080;font-size:12px;margin-top:5px}.quickExpenseFields{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;align-items:end;gap:10px}.quickExpenseFields label{font-size:12px;color:#597363;font-weight:800;min-width:0}.quickExpenseFields input:not([type=checkbox]){display:block;min-width:0;width:100%;margin-top:7px;border:1px solid #d9e3d9;border-radius:12px;padding:12px 10px;background:#fff;color:#293c34;font-size:13px}.quickExpenseFields .quickCheck{display:flex;gap:5px;align-items:center;white-space:nowrap;padding-bottom:13px}.quickCheck input{accent-color:#5e876a;width:17px;height:17px}.expenseSubmit{margin-top:14px;width:100%}.formError{color:#a14536;font-size:12px;margin:12px 0 0}
@media(max-width:840px){.quickExpenseFields{grid-template-columns:1fr 1fr}.quickExpenseFields .quickCheck{padding:9px 0}}
@media(max-width:540px){.quickExpenseFields{grid-template-columns:1fr}.quickExpense{padding:15px}.moa-buddy{left:46%;bottom:38px;transform:translateX(-50%) scale(.8);animation:none}.buddy-speech{right:-50px;font-size:10px}}
@media(prefers-reduced-motion:reduce){.moa-buddy{animation:none}}

/* V1.3: compact itinerary, route preview, and mobile travel controls */
.routePreview{background:linear-gradient(135deg,#f0f6ea,#fff9ee);border:1px solid #e1e9dc;border-radius:19px;padding:16px;margin:14px 0 18px}
.routeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.routeTop strong{font-size:14px}.routeTop small{color:#718375;font-size:11px}
.routeStops{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}
.routeStop{display:inline-flex;gap:7px;align-items:center;max-width:100%;background:#fff;border:1px solid #dfe9d9;padding:7px 10px;border-radius:30px;font-size:12px;font-weight:700;color:#4b6855}
.routeStop .routeNumber{background:#6e9b7b;color:white;width:19px;height:19px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px}
.routeDivider{color:#9ab49c;font-size:13px}.routeNote{color:#879383;font-size:11px;line-height:1.6;margin:6px 0}
.entry{transition:background .15s;border-radius:13px}.entry:hover{background:#fbfdf9}.entry .em{flex:none}.entrybody{min-width:0;flex:1}.entrybody p{line-height:1.6;overflow-wrap:anywhere}.entryactions{flex-shrink:0}
.dayStatus{margin-left:9px;font-size:10px;opacity:.85}.daytab{white-space:nowrap}.dayline{overflow-x:auto;flex-wrap:nowrap;padding-bottom:7px;scrollbar-width:thin}
.quickAddStop{display:grid;grid-template-columns:1fr 100px auto;gap:8px;padding:10px;border:1px dashed #cddfcf;background:#f9fcf8;border-radius:14px;margin:10px 0}
.quickAddStop input{min-width:0;border:1px solid #dce7dc;background:white;border-radius:11px;padding:11px;font-size:13px}.quickAddStop button{white-space:nowrap}
.dayProgress{display:flex;align-items:center;gap:9px;font-size:12px;color:#698071;margin:8px 0 0}.progressTrack{height:7px;flex:1;background:#e9efe7;border-radius:12px;overflow:hidden}.progressFill{height:100%;background:#86af87;border-radius:12px}
.momoHello{display:flex;align-items:center;gap:10px;background:#f5f2e6;padding:12px 16px;border-radius:16px;color:#657c65;font-size:12px;font-weight:600;margin-top:14px}.momoFace{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:#d1e3bc;border:2px solid #83a58d;position:relative;font-size:23px;flex:none}.momoFace:after{content:'✿';position:absolute;right:-5px;top:-10px;color:#e8ae8e;font-size:15px}
.backupInfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#68806f;margin-top:13px}
@media(max-width:700px){.routePreview{padding:12px}.quickAddStop{grid-template-columns:1fr 90px}.quickAddStop button{grid-column:1/-1}.detailhero{padding:20px}.entryactions button{min-width:34px}.plannerSide .panel{padding:18px}.routeStop{font-size:11px}.momoHello{margin-bottom:10px}}

<body>
<header class="topbar"><div class="shell toprow"><button class="brand" data-nav="home"><span class="brandmark">✿</span><span class="brandtext">moa<span style="color:#8cb397">.</span></span></button><nav class="topnav"><button class="navlink active" data-nav="home">홈</button><button class="navlink" data-nav="dashboard">내 여행</button><button class="navlink" data-nav="explore">여행 탐색</button><button class="navlink" data-nav="community">커뮤니티</button></nav><div class="topactions"><span class="pill" title="V1.1은 로컬 데모입니다">🌿 게스트 모드</span><button class="primary" id="topCreate">＋ 여행 만들기</button></div></div></header>
<main id="app" class="shell"></main>
<footer class="footer"><div class="shell">© 2026 moa. · 여행의 순간을 모으다 <span style="float:right">V1.2 독립형 로컬 데모 · 계정 연동 전</span></div></footer>
<nav class="mobilebar"><button data-nav="home"><span>⌂</span>홈</button><button data-nav="dashboard"><span>▦</span>내 여행</button><button data-nav="explore"><span>⌕</span>탐색</button><button data-nav="community"><span>♡</span>커뮤니티</button></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(function(){'use strict';
const STORAGE_KEY='moa-v1-trips-independent-2026';const app=document.getElementById('app');const modalRoot=document.getElementById('modalRoot');let page='home',filter='all',detailId=null,detailDay=0,plannerTab='schedule',plannerMode='plan';let trips=[];
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');trips=Array.isArray(saved)?saved.filter(t=>t&&typeof t.id==='string'):[]}catch(e){console.warn('저장된 데이터 읽기 실패',e);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(trips));return true}catch(e){toast('저장에 실패했어요. 저장 공간을 확인해 주세요.');return false}}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>r.innerHTML='',3000)}
function parseDate(d){let a=String(d||'').split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)}
function days(t){const n=Math.round((parseDate(t.end)-parseDate(t.start))/86400000)+1;return Number.isFinite(n)&&n>0?Math.min(n,120):1}
function fmt(d){return String(d||'').replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1.$2.$3')}
function duration(t){return `${fmt(t.start)} – ${fmt(t.end)} · ${days(t)-1}박 ${days(t)}일`}
function selected(t){return trips.find(x=>x.id===t)}
function theme(t){return ({sea:['#b9d9d4','#e5eee7','🏝️'],mountain:['#b8d0b1','#eff0d9','⛰️'],city:['#dfd6c8','#f3e5d0','🏙️'],nature:['#c8d7ba','#eee4bb','🌿'],spring:['#ead3db','#f4e7db','🌸']})[t.theme]||['#c4dbca','#f4e5cd','✈️']}
function cover(t){const c=theme(t);return `<div class="cover" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span class="symbol">${c[2]}</span></div>`}
function card(t){return `<article class="trip">${cover(t)}<div class="tripbody"><span class="badge ${t.status==='done'?'done':''}">${t.status==='done'?'✓ 다녀온 여행':'✦ 계획 중'}</span><h3>${esc(t.title)}</h3><p>📍 ${esc(t.destination)}<br>📅 ${duration(t)}</p><div class="tripfoot"><span class="tiny muted">👥 ${Number(t.people)||1}명 · ${esc(t.type)}</span><button class="textbtn" data-detail="${esc(t.id)}">여행 열기 ↗</button></div></div></article>`}
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">Collect your moments, together</span><h1>여행의 모든 순간,<br><em>모아</em>서 더 특별하게.</h1><p>설레는 여행 계획부터 함께 만드는 일정, 소중한 추억까지.<br>당신의 여행이 시작되고 쌓이는 공간, 모아.</p><div class="heroactions"><button class="primary" data-create>나의 여행 만들기 ↗</button><button class="secondary" data-nav="dashboard">내 여행 둘러보기</button></div><p style="margin-top:17px;font-size:12px">☁️ 현재 데모는 이 브라우저에만 저장돼요.</p></div><div class="heroart" aria-label="언덕과 햇살을 표현한 여행 일러스트"><div class="sun"></div><div class="mountain back"></div><div class="mountain"></div><div class="mountain front"></div><div class="moa-buddy" aria-label="웃는 여행 가방 캐릭터 모모" role="img"><div class="buddy-handle"></div><div class="buddy-body"><span class="buddy-sticker">✿</span><span class="buddy-eyes"><i></i><i></i></span><span class="buddy-cheeks">●　　　●</span><span class="buddy-smile"></span></div><span class="buddy-foot one"></span><span class="buddy-foot two"></span><div class="buddy-speech">여행 준비, 모아랑! ♡</div></div><span class="spark">✦</span><div class="floatcard left"><strong>📍 다음 여행, 어디로?</strong><span>마음이 가는 곳부터 시작해요</span></div><div class="floatcard right"><strong>🧳 함께 만드는 여행</strong><span>계획부터 추억까지 한곳에</span></div></div></section><section class="section"><div class="secthead"><div><span class="eyebrow">Why MOA?</span><h2>여행 준비, 더 간편하고 즐겁게</h2></div></div><div class="features"><div class="feature"><div class="fi">🗓️</div><h3>한눈에 보는 여행 계획</h3><p>여행지와 날짜부터 일정까지, 복잡하지 않게 차곡차곡 정리해요.</p></div><div class="feature"><div class="fi">👫</div><h3>함께 만드는 여행</h3><p>친구나 연인과 하나의 계획표를 함께 완성해요. 초대 기능은 다음 버전에서 제공돼요.</p></div><div class="feature"><div class="fi">💌</div><h3>추억을 나누는 커뮤니티</h3><p>다른 여행자의 이야기에서 영감을 받아요. 커뮤니티는 다음 버전에서 만나요.</p></div></div></section><div class="bottom-banner"><div><h2>어디로 떠날지 정했나요?</h2><p>여행지를 적는 순간, 새로운 이야기가 시작돼요.</p></div><button class="primary" data-create>＋ 새 여행 시작하기</button></div>`}
function dashboard(){const shown=trips.filter(t=>filter==='all'||t.status===filter),planned=trips.filter(t=>t.status==='planning').length,done=trips.filter(t=>t.status==='done').length;app.innerHTML=`<div class="pagehead"><div><span class="eyebrow">My travel collection</span><h1>내 여행 모아보기 🌿</h1><p>떠날 여행도, 다녀온 추억도 한곳에서 관리해요.</p></div><button class="primary" data-create>＋ 새 여행</button></div><div class="stats"><div class="stat"><span class="sub">전체 여행</span><div class="num">${trips.length}</div></div><div class="stat"><span class="sub">계획 중</span><div class="num">${planned}</div></div><div class="stat"><span class="sub">다녀온 여행</span><div class="num">${done}</div></div></div><div class="secthead"><div><h2>나의 여행</h2></div><div class="actionrow"><button class="secondary" data-import style="font-size:12px;padding:10px">↑ 백업 불러오기</button><button class="secondary" data-export style="font-size:12px;padding:10px">↓ 백업 내보내기</button></div></div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">전체 ${trips.length}</button><button class="filter ${filter==='planning'?'active':''}" data-filter="planning">계획 중 ${planned}</button><button class="filter ${filter==='done'?'active':''}" data-filter="done">다녀온 여행 ${done}</button></div><div class="tripgrid">${shown.length?shown.map(card).join(''):`<div class="empty"><div class="large">🧳🌷</div><h3>${filter==='all'?'아직 만든 여행이 없어요':'해당하는 여행이 없어요'}</h3><p>가고 싶은 여행지부터 등록해볼까요?</p><button class="primary" data-create style="margin-top:13px">첫 여행 만들기</button></div>`}${shown.length?'<button class="newtripCard" data-create><span class="plus">＋</span><strong>새 여행 만들기</strong><span class="tiny muted">다음 설렘을 채워주세요</span></button>':''}</div>`}
function coming(kind){const isExplore=kind==='explore';app.innerHTML=`<section class="coming"><div class="large">${isExplore?'🗺️':'💌'}</div><span class="eyebrow">Coming in the next version</span><h1>${isExplore?'다른 여행자의 일정을 발견하는 곳':'여행 이야기가 모이는 곳'}</h1><p>${isExplore?'도시·여행 스타일별로 일정을 찾아보고 내 여행으로 복사하는 기능을 준비 중이에요.':'사진, 후기, 좋아요, 댓글로 여행 꿀팁을 공유하는 공간을 준비 중이에요.'}<br>현재 V1.3은 개인 여행 플래너를 사용할 수 있는 로컬 시제품이에요.</p><button class="primary" data-nav="dashboard">내 여행으로 돌아가기</button></section>`}
function uuid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():`item-${Date.now()}-${Math.random().toString(36).slice(2,8)}`}
function ensureTrip(t){for(const k of ['stops','expenses','shopping','checklist'])if(!Array.isArray(t[k]))t[k]=[]}
function money(n){return new Intl.NumberFormat('ko-KR').format(Number(n)||0)}
function formatStop(s){return [s.time||'시간 미정',s.transport?`🚶 ${s.transport}`:'',s.address||'',s.note||''].filter(Boolean).map(esc).join(' · ')}
function plannerNav(){return `<div class="plannerTabs" aria-label="플래너 메뉴">${[['schedule','🗓️ 일정'],['expense','💰 경비'],['shopping','🛍️ 쇼핑'],['checklist','✅ 준비물']].map(([k,l])=>`<button data-planner-tab="${k}" class="${plannerTab===k?'active':''}">${l}</button>`).join('')}</div>`}
function dayStops(t){return t.stops.filter(s=>Number(s.day)===detailDay).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function routePreview(t){const list=dayStops(t).filter(s=>!s.candidate),usable=list.filter(s=>String(s.address||'').trim());return `<div class="routePreview"><div class="routeTop"><strong>🗺️ 오늘의 동선 미리보기</strong><small>확정 장소 · 시간순 · ${list.length}곳</small></div>${list.length?`<div class="routeStops">${list.map((s,i)=>`<span class="routeStop"><span class="routeNumber">${i+1}</span>${esc(s.name)}</span>${i<list.length-1?'<span class="routeDivider">→</span>':''}`).join('')}</div>`:'<p class="routeNote">확정된 장소를 추가하면 여기에 동선이 나타나요. 후보 장소는 제외돼요.</p>'}<div class="actionrow"><button class="secondary mini" data-route-map ${usable.length<2?'disabled':''}>↗ 지도에서 경로 보기</button>${usable.length<2?'<span class="tiny muted">주소가 입력된 확정 장소 2곳 이상 필요해요.</span>':''}</div><p class="routeNote">실제 지도나 이동시간을 계산하는 기능은 아니며, 지도 서비스에서 경로를 확인해요. 길찾기 전 경유지 순서를 확인해 주세요.</p></div>`}
function openDayRoute(){const t=selected(detailId);if(!t)return;const items=dayStops(t).filter(s=>!s.candidate&&String(s.address||'').trim());if(items.length<2){toast('주소가 있는 확정 장소를 2곳 이상 추가해 주세요.');return}const points=items.slice(0,10).map(s=>s.address.trim());const base='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(points[0])+'&destination='+encodeURIComponent(points[points.length-1])+'&travelmode=driving';const mids=points.slice(1,-1);const url=base+(mids.length?'&waypoints='+encodeURIComponent(mids.join('|')):'');window.open(url,'_blank','noopener,noreferrer');if(items.length>10)toast('지도 링크에는 처음 10개 장소만 포함했어요.');}
function stopRows(t){let list=dayStops(t);return list.length?list.map((s,i)=>`<div class="entry"><span class="em">${s.candidate?'💭':'<span class="routeNumber" style="background:#e5f0e5;color:#567e65;padding:6px 10px;border-radius:50%;font-weight:800">'+(i+1)+'</span>'}</span><div class="entrybody"><strong class="${s.done?'doneText':''}">${esc(s.name)}</strong>${s.candidate?'<span class="statusChip">후보</span>':''}<p>${formatStop(s)}</p>${s.address?`<div class="actionrow" style="margin-top:7px"><button class="textbtn" data-map="${esc(s.id)}">📍 지도 열기</button><button class="textbtn" data-copy-address="${esc(s.id)}">주소 복사</button></div>`:''}</div><div class="entryactions">${plannerMode==='travel'?`<button data-done-stop="${esc(s.id)}" title="방문 체크">${s.done?'↩️':'✓'}</button>`:`<button data-edit-stop="${esc(s.id)}" title="수정">✎</button><button data-delete-stop="${esc(s.id)}" title="삭제">×</button>`}</div></div>`).join(''):`<div class="emptyMini">🐣 아직 일정이 비어 있어요.<br>첫 장소를 콕! 추가해볼까요?</div>`}
function dayProgress(t){let list=dayStops(t).filter(x=>!x.candidate),done=list.filter(x=>x.done).length;return `<div class="dayProgress">방문 ${done}/${list.length}곳<div class="progressTrack"><div class="progressFill" style="width:${list.length?Math.round(done/list.length*100):0}%"></div></div></div>`}
function expenseView(t){const arr=t.expenses;const total=arr.reduce((n,x)=>n+(Number(x.amount)||0),0),paid=arr.filter(x=>x.paid).reduce((n,x)=>n+(Number(x.amount)||0),0);return `<div class="secthead"><div><span class="softtag">🪙 여행 예산 노트</span><h2>💰 여행 경비 모아보기</h2></div><button type="button" class="secondary mini" data-add-item="expense">＋ 상세 입력</button></div><p class="tinyHint">금액은 원화(KRW) 기준이에요. 경비를 아래에서 바로 추가하거나 상세 입력 버튼을 눌러주세요.</p><div class="moneybar"><div><small>전체 경비</small><b>${money(total)}원</b></div><div><small>결제 완료</small><b>${money(paid)}원</b></div><div><small>결제 예정</small><b>${money(total-paid)}원</b></div></div><form id="quickExpenseForm" class="quickExpense" novalidate><div class="quickExpenseTitle">✿ 경비 바로 추가하기 <span>숙소, 항공권, 맛집 비용을 차곡차곡!</span></div><div class="quickExpenseFields"><label>항목명 <input name="name" type="text" maxlength="80" placeholder="예: 호텔 숙박비" required></label><label>금액 (원) <input name="amount" inputmode="numeric" type="number" min="0" max="10000000000" step="1" placeholder="예: 250000" required></label><label>결제자 <input name="payer" type="text" maxlength="40" placeholder="예: 나"></label><label class="quickCheck"><input type="checkbox" name="paid"> 결제 완료</label></div><button type="submit" class="primary expenseSubmit">＋ 경비 저장하기</button><p id="expenseError" class="formError" role="alert" hidden></p></form>${arr.length?`<div class="responsiveTable"><table><thead><tr><th>항목</th><th>결제자</th><th>금액</th><th>상태</th><th>관리</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.payer||'미정')}</td><td class="amount">${money(x.amount)}원</td><td><button type="button" data-toggle-item="expense:${esc(x.id)}">${x.paid?'✅ 완료':'○ 예정'}</button></td><td><button type="button" data-edit-item="expense:${esc(x.id)}">수정</button> <button type="button" data-delete-item="expense:${esc(x.id)}">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="emptyMini">🪙 첫 번째 경비를 등록해 보세요! 저장하면 아래에 나타나요.</div>'}`}
function shoppingView(t){return `<div class="secthead"><h2>🛍️ 쇼핑리스트</h2><button class="secondary mini" data-add-item="shopping">＋ 물건 추가</button></div><p class="tinyHint">담당자와 매장, 날짜 메모를 한 줄에 모아볼 수 있어요.</p>${t.shopping.length?`<div class="responsiveTable"><table><thead><tr><th>완료</th><th>물건</th><th>담당자</th><th>매장·장소</th><th>메모</th><th>관리</th></tr></thead><tbody>${t.shopping.map(x=>`<tr><td><input class="list-check" type="checkbox" data-toggle-item="shopping:${esc(x.id)}" ${x.done?'checked':''} aria-label="${esc(x.name)} 완료"></td><td class="${x.done?'doneText':''}"><b>${esc(x.name)}</b></td><td>${esc(x.owner||'미정')}</td><td>${esc(x.shop||'—')}</td><td>${esc(x.note||'—')}</td><td><button data-edit-item="shopping:${esc(x.id)}">수정</button> <button data-delete-item="shopping:${esc(x.id)}">삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="emptyMini">🧸 사고 싶은 것을 모아봐요!</div>'}`}
function checklistView(t){const done=t.checklist.filter(x=>x.done).length;return `<div class="secthead"><h2>✅ 여행 준비 체크</h2><button class="secondary mini" data-add-item="checklist">＋ 준비물 추가</button></div><div class="miniStat">🌱 ${done}/${t.checklist.length}개 준비 완료</div>${t.checklist.length?t.checklist.map(x=>`<div class="listrow"><input class="list-check" type="checkbox" data-toggle-item="checklist:${esc(x.id)}" ${x.done?'checked':''} aria-label="${esc(x.name)} 완료"><label class="${x.done?'doneText':''}">${esc(x.name)}</label><button class="textbtn" data-edit-item="checklist:${esc(x.id)}">수정</button><button class="dots" data-delete-item="checklist:${esc(x.id)}">×</button></div>`).join(''):'<div class="emptyMini">🎒 여권·충전기·예약 확인 등 준비할 일을 모아봐요!</div>'}`}
function detail(){const t=selected(detailId);if(!t){page='dashboard';dashboard();return}ensureTrip(t);const n=days(t);detailDay=Math.max(0,Math.min(detailDay,n-1));const date=new Date(parseDate(t.start));date.setDate(date.getDate()+detailDay);const dateStr=`${date.getMonth()+1}/${date.getDate()}`;let main='';
if(plannerTab==='schedule')main=`<div class="secthead"><h2>${plannerMode==='plan'?'🗓️ 날짜별 일정':'🎒 오늘의 여행'}</h2>${plannerMode==='plan'?'<button class="secondary mini" data-add-stop>＋ 장소 추가</button>':''}</div><div class="dayline">${Array.from({length:n},(_,i)=>`<button class="daytab ${i===detailDay?'active':''}" data-day="${i}">DAY ${i+1}<span class="dayStatus">${t.stops.filter(s=>Number(s.day)===i).length}곳</span></button>`).join('')}</div><div class="softtag">🌤️ DAY ${detailDay+1} · ${dateStr}</div>${plannerMode==='travel'?`<div class="mobileModeNote" style="margin-top:14px">여행 모드에서는 방문 체크와 주소 확인을 빠르게 할 수 있어요 ♡</div>${dayProgress(t)}`:`<form id="quickStopForm" class="quickAddStop"><input name="name" maxlength="90" required aria-label="장소명" placeholder="방문할 장소를 입력해요"><input type="time" name="time" aria-label="시간"><button class="primary mini" type="submit">＋ 빠른 추가</button></form>`}${routePreview(t)}<div style="margin-top:12px">${stopRows(t)}</div>`;
if(plannerTab==='expense')main=expenseView(t);if(plannerTab==='shopping')main=shoppingView(t);if(plannerTab==='checklist')main=checklistView(t);
const completed=t.stops.filter(x=>x.done).length;
app.innerHTML=`<div class="detailtop"><button class="back" data-nav="dashboard">← 내 여행으로 돌아가기</button><div class="detailhero"><div><span class="eyebrow">My little trip · ${esc(t.destination)}</span><h1>${esc(t.title)} <span style="font-size:20px">✿</span></h1><span class="muted" style="font-size:13px">${duration(t)} · 👥 ${Number(t.people)||1}명</span></div><span style="font-size:57px">${theme(t)[2]}</span></div></div><div class="modebar"><button data-mode="plan" class="${plannerMode==='plan'?'active':''}">✏️ 계획 모드</button><button data-mode="travel" class="${plannerMode==='travel'?'active':''}">🧳 여행 모드</button></div>${plannerNav()}<div class="plannerGrid"><div class="plannerMain"><div class="panel">${main}</div></div><div class="plannerSide"><div class="panel"><h2>💌 여행 한눈에</h2><div class="note">📍 ${esc(t.destination)}<br>👥 ${Number(t.people)||1}명 · ${esc(t.type)}<br>📝 ${esc(t.memo||'특별한 여행 이야기를 채워봐요!')}</div><div class="momoHello"><span class="momoFace">•ᴗ•</span><span>모모가 여행 준비를 응원해요! 🌷</span></div><div class="miniStat" style="margin-top:15px">📍 일정 ${t.stops.length}개 · 방문 ${completed}개</div><div class="actionrow" style="margin-top:14px"><button class="secondary mini" data-edit>여행 수정</button><button class="secondary mini" data-toggle>${t.status==='done'?'계획 중으로 변경':'다녀온 여행으로 변경'}</button></div></div><div class="panel"><h2>☁️ 나의 데이터</h2><p class="note">이 버전은 브라우저에 자동 저장돼요. 기기를 바꾸면 자동으로 동기화되지는 않으니 JSON 백업을 보관해 주세요.</p><div class="backupInfo">🌿 수정한 내용은 이 브라우저에 자동 저장돼요.</div><div class="actionrow"><button class="secondary mini" data-export>백업 다운로드</button><button class="secondary mini" data-delete style="color:#ab6a62">여행 삭제</button></div></div></div></div>`}
function nav(dest){if(!['home','dashboard','explore','community'].includes(dest))return;page=dest;detailId=null;document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===dest));render();history.replaceState(null,'','#'+dest);window.scrollTo({top:0,behavior:'instant'})}

function modal(content){modalRoot.innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;document.body.style.overflow='hidden';const focus=modalRoot.querySelector('input');if(focus)focus.focus()}

function formTrip(t){const edit=!!t;modal(`<form id="tripForm"><div class="modalhead"><h2>${edit?'여행 정보 수정':'새로운 여행 만들기 ✨'}</h2><button class="iconbtn" type="button" data-close aria-label="닫기">×</button></div><p class="muted tiny" style="margin-top:-10px">가고 싶은 곳과 날짜만 정해도 여행이 시작돼요.</p><div class="field"><label for="title">여행 이름 *</label><input id="title" name="title" maxlength="70" required placeholder="예: 도쿄 맛집 여행" value="${esc(t?.title||'')}"></div><div class="field"><label for="destination">여행지 *</label><input id="destination" name="destination" maxlength="80" required placeholder="예: 일본 도쿄" value="${esc(t?.destination||'')}"></div><div class="formrow"><div class="field"><label for="start">출발일 *</label><input id="start" type="date" name="start" required value="${esc(t?.start||'')}"></div><div class="field"><label for="end">귀국일 *</label><input id="end" type="date" name="end" required value="${esc(t?.end||'')}"></div></div><div class="formrow"><div class="field"><label for="people">인원</label><input id="people" type="number" name="people" min="1" max="100" value="${Number(t?.people)||2}"></div><div class="field"><label for="type">여행 스타일</label><select id="type" name="type">${['커플 여행','친구 여행','가족 여행','혼자 여행','기타'].map(s=>`<option ${t?.type===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label for="theme">커버 테마</label><select id="theme" name="theme">${[['city','도시'],['sea','바다'],['mountain','산'],['nature','자연'],['spring','꽃']].map(([k,v])=>`<option value="${k}" ${(t?.theme||'city')===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="memo">여행 메모</label><textarea id="memo" name="memo" maxlength="400" placeholder="여행에서 하고 싶은 것들">${esc(t?.memo||'')}</textarea></div><div class="modalactions"><button class="secondary" type="button" data-close>취소</button><button class="primary" type="submit">${edit?'수정 완료':'여행 만들기'}</button></div></form>`);document.getElementById('tripForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const start=String(f.get('start')),end=String(f.get('end'));if(end<start){toast('귀국일은 출발일 이후여야 해요.');return}if((parseDate(end)-parseDate(start))/86400000>119){toast('현재 데모에서는 120일 이내 여행만 지원해요.');return}const vals={title:String(f.get('title')).trim(),destination:String(f.get('destination')).trim(),start,end,people:Math.min(100,Math.max(1,Number(f.get('people'))||1)),type:String(f.get('type')),theme:String(f.get('theme')),memo:String(f.get('memo')).trim()};if(!vals.title||!vals.destination){toast('여행 이름과 여행지를 입력해 주세요.');return}if(edit){Object.assign(t,vals);if(!save())return;toast('여행 정보를 수정했어요.')}else{t={id:crypto.randomUUID?crypto.randomUUID():`trip-${Date.now()}`,status:'planning',stops:[],createdAt:new Date().toISOString(),...vals};trips.unshift(t);if(!save())return;toast('새 여행이 만들어졌어요! 🌿')}closeModal();detailId=t.id;detailDay=0;page='dashboard';plannerTab='schedule';plannerMode='plan';render()}}
function formStop(editId){const t=selected(detailId);if(!t)return;ensureTrip(t);const x=editId?t.stops.find(v=>v.id===editId):null;modal(`<form id="stopForm"><div class="modalhead"><h2>${x?'✏️ 일정 수정':'📍 장소 추가하기'}</h2><button type="button" class="iconbtn" data-close>×</button></div><p class="muted tiny">DAY ${detailDay+1} · 동선과 메모까지 기록해요.</p><div class="field"><label>장소 또는 일정 이름 *</label><input name="place" maxlength="90" required placeholder="예: 센소지 구경" value="${esc(x?.name||'')}"></div><div class="formrow"><div class="field"><label>시간</label><input type="time" name="time" value="${esc(x?.time||'')}"></div><div class="field"><label>이동수단</label><select name="transport">${['','도보','지하철','버스','택시','기차','렌터카','기타'].map(v=>`<option value="${v}" ${x?.transport===v?'selected':''}>${v||'선택 안 함'}</option>`).join('')}</select></div></div><div class="field"><label>주소 (지도 연결용)</label><input name="address" maxlength="200" placeholder="예: 도쿄도 다이토구 아사쿠사" value="${esc(x?.address||'')}"></div><div class="field"><label>메모</label><textarea name="note" maxlength="500" placeholder="예약 정보, 이동 팁 등">${esc(x?.note||'')}</textarea></div><div class="field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="candidate" ${x?.candidate?'checked':''} style="width:auto"> 아직 고민 중인 후보 장소</label></div><div class="modalactions"><button type="button" class="secondary" data-close>취소</button><button type="submit" class="primary">${x?'수정 완료':'장소 추가'}</button></div></form>`);document.getElementById('stopForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('place')).trim();if(!name)return;const vals={name,time:String(f.get('time')||''),transport:String(f.get('transport')||''),address:String(f.get('address')||'').trim(),note:String(f.get('note')||'').trim(),candidate:f.has('candidate')};if(x)Object.assign(x,vals);else t.stops.push({id:uuid(),day:detailDay,done:false,...vals});if(!save())return;closeModal();detail();toast(x?'장소를 수정했어요.':'새 장소를 추가했어요!')}}
function collectionKey(kind){return kind==='expense'?'expenses':kind}
function itemForm(kind,id){const t=selected(detailId);if(!t||!['expense','shopping','checklist'].includes(kind))return;ensureTrip(t);const arr=t[collectionKey(kind)];const x=id?arr.find(v=>v.id===id):null;
const names={expense:'경비',shopping:'쇼핑',checklist:'준비물'};let fields='';
if(kind==='expense')fields=`<div class="field"><label>경비 항목 *</label><input required maxlength="80" name="name" value="${esc(x?.name||'')}" placeholder="예: 항공권"></div><div class="formrow"><div class="field"><label>금액 (원) *</label><input required type="number" min="0" max="10000000000" step="1" name="amount" value="${x?.amount??''}" placeholder="150000"></div><div class="field"><label>결제자</label><input maxlength="40" name="payer" value="${esc(x?.payer||'')}" placeholder="예: 나"></div></div><div class="field"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="paid" style="width:auto" ${x?.paid?'checked':''}> 결제 완료</label></div>`;
if(kind==='shopping')fields=`<div class="field"><label>쇼핑할 물건 *</label><input required maxlength="90" name="name" value="${esc(x?.name||'')}" placeholder="예: 기념품"></div><div class="formrow"><div class="field"><label>담당자</label><input maxlength="40" name="owner" value="${esc(x?.owner||'')}" placeholder="예: 나"></div><div class="field"><label>매장·장소</label><input maxlength="90" name="shop" value="${esc(x?.shop||'')}" placeholder="예: 시내 쇼핑몰"></div></div><div class="field"><label>메모 / 구입 예정일</label><input maxlength="170" name="note" value="${esc(x?.note||'')}" placeholder="예: DAY 2 오후"></div>`;
if(kind==='checklist')fields=`<div class="field"><label>준비할 일 또는 준비물 *</label><input required maxlength="120" name="name" value="${esc(x?.name||'')}" placeholder="예: 여권 챙기기"></div>`;
modal(`<form id="itemForm"><div class="modalhead"><h2>${x?'✏️ '+names[kind]+' 수정':'✿ '+names[kind]+' 추가'}</h2><button type="button" class="iconbtn" data-close>×</button></div>${fields}<div class="modalactions"><button type="button" class="secondary" data-close>취소</button><button type="submit" class="primary">${x?'수정 완료':'추가하기'}</button></div></form>`);
document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim();if(!name)return;let vals={name};if(kind==='expense'){vals={...vals,amount:Math.round(Number(f.get('amount'))),payer:String(f.get('payer')||'').trim(),paid:f.has('paid')};if(!Number.isSafeInteger(vals.amount)||vals.amount<0||vals.amount>1e10){toast('올바른 금액을 입력해 주세요.');return}}if(kind==='shopping')vals={...vals,owner:String(f.get('owner')||'').trim(),shop:String(f.get('shop')||'').trim(),note:String(f.get('note')||'').trim()};if(x)Object.assign(x,vals);else arr.push({id:uuid(),done:false,...vals});if(!save())return;closeModal();detail();toast('저장했어요! 🌼')}}
function importData(){const picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';picker.addEventListener('change',async()=>{const file=picker.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),imported=Array.isArray(raw)?raw:raw.trips;if(!Array.isArray(imported)||!imported.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.start==='string'&&typeof t.end==='string'))throw Error('형식 오류');if(!confirm('현재 모아 여행 목록을 백업 파일로 교체할까요? 기존 여행이 있다면 먼저 백업을 다운로드해 주세요.'))return;const previous=trips;trips=imported.map(t=>({...t}));if(!save()){trips=previous;return}detailId=null;page='dashboard';render();toast(imported.length+'개 여행을 불러왔어요! 🌷')}catch(e){toast('올바른 모아 JSON 백업 파일이 아니에요.')}});picker.click()}
function exportData(){const blob=new Blob([JSON.stringify({version:'1.3',app:'moa',exportedAt:new Date().toISOString(),trips},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moa_trips_backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON 백업 파일을 저장했어요.')}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.hasAttribute('data-nav')){nav(el.dataset.nav);return}if(el.hasAttribute('data-create')||el.id==='topCreate'){formTrip();return}if(el.hasAttribute('data-filter')){filter=el.dataset.filter;render();return}if(el.hasAttribute('data-detail')){detailId=el.dataset.detail;detailDay=0;plannerTab='schedule';plannerMode='plan';render();window.scrollTo(0,0);return}if(el.hasAttribute('data-day')){detailDay=Number(el.dataset.day);render();return}if(el.hasAttribute('data-close')){closeModal();return}if(el.hasAttribute('data-edit')){formTrip(selected(detailId));return}if(el.hasAttribute('data-mode')){plannerMode=el.dataset.mode;render();return}if(el.hasAttribute('data-planner-tab')){plannerTab=el.dataset.plannerTab;render();return}if(el.hasAttribute('data-edit-stop')){formStop(el.dataset.editStop);return}if(el.hasAttribute('data-done-stop')){const t=selected(detailId),s=t?.stops.find(x=>x.id===el.dataset.doneStop);if(s){s.done=!s.done;if(save())detail()}return}if(el.hasAttribute('data-route-map')){openDayRoute();return}if(el.hasAttribute('data-map')){const s=selected(detailId)?.stops.find(x=>x.id===el.dataset.map);if(s?.address){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address),'_blank','noopener,noreferrer')}return}if(el.hasAttribute('data-copy-address')){const s=selected(detailId)?.stops.find(x=>x.id===el.dataset.copyAddress);if(s?.address){navigator.clipboard?.writeText(s.address).then(()=>toast('주소를 복사했어요.')).catch(()=>toast('주소 복사에 실패했어요.'))}return}if(el.hasAttribute('data-add-item')){itemForm(el.dataset.addItem);return}if(el.hasAttribute('data-edit-item')){const [k,id]=el.dataset.editItem.split(':');itemForm(k,id);return}if(el.hasAttribute('data-delete-item')){const [k,id]=el.dataset.deleteItem.split(':'),t=selected(detailId);if(!t||!['expense','shopping','checklist'].includes(k)||!confirm('이 항목을 삭제할까요?'))return;t[collectionKey(k)]=t[collectionKey(k)].filter(x=>x.id!==id);if(save())detail();return}if(el.hasAttribute('data-toggle-item')&&el.tagName==='BUTTON'){const [k,id]=el.dataset.toggleItem.split(':'),t=selected(detailId);const v=t?.[collectionKey(k)]?.find(x=>x.id===id);if(v){v[k==='expense'?'paid':'done']=!v[k==='expense'?'paid':'done'];if(save())detail()}return}if(el.hasAttribute('data-add-stop')){formStop();return}if(el.hasAttribute('data-export')){exportData();return}if(el.hasAttribute('data-import')){importData();return}if(el.hasAttribute('data-toggle')){const t=selected(detailId);t.status=t.status==='done'?'planning':'done';if(save()){render();toast('여행 상태를 변경했어요.')}return}if(el.hasAttribute('data-delete-stop')){const t=selected(detailId);if(!confirm('이 일정을 삭제할까요?'))return;t.stops=t.stops.filter(s=>s.id!==el.dataset.deleteStop);if(save())detail();return}if(el.hasAttribute('data-delete')){if(!confirm('이 여행과 등록된 일정을 삭제할까요? 이 작업은 되돌릴 수 없어요.'))return;trips=trips.filter(t=>t.id!==detailId);if(save()){detailId=null;nav('dashboard');toast('여행을 삭제했어요.')}return}});
document.addEventListener('submit',e=>{if(e.target?.id!=='quickStopForm')return;e.preventDefault();const t=selected(detailId);if(!t)return;ensureTrip(t);const f=new FormData(e.target),name=String(f.get('name')||'').trim(),time=String(f.get('time')||'');if(!name)return;t.stops.push({id:uuid(),day:detailDay,name,time,transport:'',address:'',note:'',candidate:false,done:false});if(!save()){t.stops.pop();return}detail();toast('장소가 추가됐어요! 🌷')});
document.addEventListener('submit',e=>{if(e.target?.id!=='quickExpenseForm')return;e.preventDefault();const form=e.target,t=selected(detailId);if(!t){toast('여행을 선택한 뒤 다시 시도해 주세요.');return}ensureTrip(t);const f=new FormData(form),name=String(f.get('name')||'').trim(),raw=String(f.get('amount')||'').trim(),amount=Number(raw),error=form.querySelector('#expenseError');const fail=message=>{error.textContent=message;error.hidden=false;toast(message)};if(!name)return fail('경비 항목을 입력해 주세요.');if(raw===''||!Number.isSafeInteger(amount)||amount<0||amount>10000000000)return fail('금액을 0원 이상의 숫자로 입력해 주세요.');const expense={id:uuid(),name,amount,payer:String(f.get('payer')||'').trim(),paid:f.has('paid'),done:false};t.expenses.push(expense);if(!save()){t.expenses.pop();return fail('저장에 실패했어요. 브라우저 저장 공간을 확인해 주세요.')}detail();toast(name+' 경비를 저장했어요! 🌼')});
